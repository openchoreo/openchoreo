#
# ExternalSecret that creates opensearch-traces-users from OpenBao: the users of the
# OpenSearch tracing module, apart from the admin credentials. Applied to the OP cluster,
# where the tracing module runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-traces-users
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: opensearch-traces-users
  data:
  - secretKey: rawQueryUsername
    remoteRef:
      key: opensearch-raw-query-username
      property: value
  - secretKey: rawQueryPassword
    remoteRef:
      key: opensearch-raw-query-password
      property: value
