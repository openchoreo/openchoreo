---
# Binds the url-shortener project to the development environment, which is what
# creates the project's data-plane namespace. Applying project.yaml alone only
# creates the Project (control-plane object); nothing then creates a
# ProjectReleaseBinding for a project applied directly via kubectl, so
# Components and Resources targeting `environment: development` fail to render
# ("namespace ... not found") until this binding exists.
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: url-shortener-development
  namespace: default
  labels:
    openchoreo.dev/project: url-shortener
    openchoreo.dev/environment: development
spec:
  owner:
    projectName: url-shortener
  environment: development
