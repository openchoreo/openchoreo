---
# Starve the Postgres StatefulSet of memory so it OOM-kills and crash-loops.
# api-service stays up but every DB query fails while Postgres is down,
# returning 500s that trigger the frontend log alert.
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: snip-postgres-development
  namespace: default
spec:
  owner:
    projectName: url-shortener
    resourceName: snip-postgres
  environment: development
  # kubectl apply's 3-way merge deletes keys missing from this manifest but
  # present in the last-applied one, so omitting persistenceEnabled here
  # would strip the `true` set by resources/postgres.yaml and make the
  # StatefulSet update (incl. the memory change below) get rejected.
  resourceTypeEnvironmentConfigs:
    memory: 8Mi
    persistenceEnabled: true
