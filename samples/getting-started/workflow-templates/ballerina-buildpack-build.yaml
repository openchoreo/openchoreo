apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ballerina-buildpack-build
spec:
  templates:
    - name: build-image
      podSpecPatch: '{"hostUsers": false}'
      inputs:
        parameters:
          - name: git-revision
          - name: build-env
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: 10Gi
        - name: app-dir
          emptyDir: {}
        # Writable scratch for buildpack generated-artifacts (not used downstream).
        - name: generated-artifacts
          emptyDir: {}
      container:
        image: cr.openchoreo.dev/openchoreo/podman-runner:v1.2
        env:
          - name: IMAGE_NAME
            value: '{{workflow.parameters.image-name}}'
          - name: IMAGE_TAG
            value: '{{workflow.parameters.image-tag}}'
          - name: GIT_REVISION
            value: '{{inputs.parameters.git-revision}}'
          - name: APP_PATH
            value: '{{workflow.parameters.app-path}}'
          - name: BUILD_ENV_JSON
            value: '{{inputs.parameters.build-env}}'
        command:
          - sh
          - -c
        args:
          - |-
            set -e

            WORKDIR=/mnt/vol/source

            IMAGE="${IMAGE_NAME}:${IMAGE_TAG}-${GIT_REVISION}"

            echo ">> Image: $IMAGE"
            echo ">> App path: $APP_PATH"

            if [ ! -d "$WORKDIR/$APP_PATH" ]; then
              echo ">> Error: The specified application path '$APP_PATH' does not exist in the repository"
              echo ">> Hint: Verify that the application path points to a valid directory in your repository."
              echo ">> Repository contents:"
              ls -la "$WORKDIR/"
              exit 1
            fi

            mkdir -p /storage/run /storage/graph
            cat > /etc/containers/storage.conf <<EOF
            [storage]
            driver = "overlay"
            runroot = "/storage/run"
            graphroot = "/storage/graph"
            [storage.options.overlay]
            EOF

            cat > /etc/containers/containers.conf <<CEOF
            [containers]
            netns="host"
            userns="host"
            ipcns="host"
            utsns="host"
            cgroupns="host"
            cgroups="disabled"
            log_driver = "k8s-file"
            [engine]
            cgroup_manager = "cgroupfs"
            events_logger="file"
            runtime="crun"
            CEOF

            echo ">> Initializing build environment"
            mkdir -p /run/podman
            podman system service --time=0 unix:///run/podman/podman.sock &
            until podman info --format '{{.Host.RemoteSocket.Exists}}' 2>/dev/null | grep -q true; do sleep 1; done
            export DOCKER_HOST=unix:///run/podman/podman.sock

            # ghcr.io/openchoreo/buildpack/ballerina:18
            BUILDER="ghcr.io/openchoreo/buildpack/ballerina@sha256:4615d47b43885210b2ae9a9b6f327cd8c10165a2d5af8e13dce6fcfefeae8a0d"
            # ghcr.io/openchoreo/buildpack/ballerina:18-run
            RUN_IMAGE="ghcr.io/openchoreo/buildpack/ballerina@sha256:121499416443e19dcb43a22e7acfa246d29427a978a43b29b5b4e7a8385b222c"

            # Build --env flags as argv entries, not shell fragments.
            # Base64 keeps embedded newlines within a single argv entry.
            set --
            has_custom_jre=false
            if [ -n "$BUILD_ENV_JSON" ] && [ "$BUILD_ENV_JSON" != "[]" ]; then
              encoded_env_entries=$(printf '%s' "$BUILD_ENV_JSON" |
                jq -r '.[] | "\(.name)=\(.value)" | @base64')
              while IFS= read -r encoded_kv; do
                [ -n "$encoded_kv" ] || continue
                kv_with_sentinel=$(
                  printf '%s' "$encoded_kv" | base64 -d
                  printf '.'
                )
                kv=${kv_with_sentinel%?}
                case "$kv" in
                  CUSTOM_JRE_VERSION=*|CUSTOM_JRE_URL=*) has_custom_jre=true ;;
                esac
                set -- "$@" --env "$kv"
              done <<EOF
            $encoded_env_entries
            EOF
            fi

            # Ballerina 2201.14+ requires Java 25. The bundled buildpack defaults
            # to Java 21 for 2201.11+, so supply Java 25 unless the user already
            # selected a custom JRE through buildEnv.
            ballerina_toml="$WORKDIR/$APP_PATH/Ballerina.toml"
            if [ "$has_custom_jre" = false ] && [ -f "$ballerina_toml" ]; then
              ballerina_version=$(awk '
                /^[[:space:]]*distribution[[:space:]]*=/ {
                  value = $0
                  sub(/^[^=]*=[[:space:]]*/, "", value)
                  quote = substr(value, 1, 1)
                  if (quote == "\"" || quote == sprintf("%c", 39)) {
                    value = substr(value, 2)
                    closing_quote = index(value, quote)
                    if (closing_quote > 0) {
                      print substr(value, 1, closing_quote - 1)
                    }
                  }
                  exit
                }
              ' "$ballerina_toml")
              ballerina_major=$(printf '%s' "$ballerina_version" | cut -d. -f1)
              ballerina_minor=$(printf '%s' "$ballerina_version" | cut -d. -f2)
              if [ "$ballerina_major" = "2201" ] && [ "$ballerina_minor" -ge 14 ] 2>/dev/null; then
                set -- "$@" --env "CUSTOM_JRE_VERSION=jdk-25.0.4.1+1"
              fi
            fi

            echo ">> Building image with Ballerina buildpack"
            pack build "$IMAGE" \
              --builder "$BUILDER" \
              --run-image "$RUN_IMAGE" \
              --docker-host inherit \
              --path "$WORKDIR/$APP_PATH" \
              --volume "/generated-artifacts:/app/generated-artifacts:rw" \
              --pull-policy always \
              "$@"

            echo ">> Image built successfully"
            until podman image exists "$IMAGE" 2>/dev/null; do sleep 1; done
            podman save -o /mnt/vol/app-image.tar "$IMAGE"
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /storage
            name: storage
          - mountPath: /app
            name: app-dir
          - mountPath: /generated-artifacts
            name: generated-artifacts
