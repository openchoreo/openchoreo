apiVersion: openchoreo.dev/v1alpha1
kind: ClusterWorkflow
metadata:
  name: dockerfile-builder-tests
  labels:
    openchoreo.dev/workflow-type: "component"
  annotations:
    openchoreo.dev/description: "Build with a provided Dockerfile, running tests first and surfacing coverage"
spec:
  workflowPlaneRef:
    kind: ClusterWorkflowPlane
    name: default
  ttlAfterCompletion: "1d"
  results:
    # Both values already existed as Argo step outputs; until now nothing read them, so a
    # consumer wanting the image a build produced had to read pod logs or the underlying
    # Argo resource. Declaring them here is the whole change.
    - name: image
      description: "The image reference this build published"
      valueFrom:
        taskResult:
          task: publish-image
          result: image
    - name: git-revision
      description: "The git revision this build checked out"
      valueFrom:
        taskResult:
          task: checkout-source
          result: git-revision
    # "test-report" is reserved: the controller additionally parses this value into the
    # typed status.testReport, so a consumer reads coverage as a field rather than by
    # unpacking a JSON string.
    - name: test-report
      description: "Summary of the test run, projected into status.testReport"
      valueFrom:
        taskResult:
          task: run-tests
          result: test-report
    # The same number as a standalone result, for consumers that want one value and not
    # the whole report - a badge, a gate, an `occ` column.
    - name: coverage-percent
      description: "Line coverage measured by the test step, as a percentage"
      valueFrom:
        taskResult:
          task: run-tests
          result: coverage-percent
    # Read from the step's exit code rather than derived from a count. With the shipped
    # defaults no JUnit report is parsed, so tests-failed is empty - and an empty count is
    # not a pass. tests-outcome is definitive whether or not a report was produced.
    - name: tests-verdict
      description: "Whether the test command succeeded"
      valueFrom:
        taskResult:
          task: run-tests
          result: tests-outcome
    # An expression rather than a task output, evaluated on the same CEL engine as the rest
    # of this spec. It reports the counts when a report was parsed and says so plainly when
    # one was not, instead of presenting an absent count as a zero.
    - name: tests-summary
      description: "Test counts, when the step produced a report"
      valueFrom:
        expression: "${tasks['run-tests'].results['tests-total'] == '' ? 'no test counts reported' : tasks['run-tests'].results['tests-passed'] + '/' + tasks['run-tests'].results['tests-total'] + ' passed'}"
  parameters:
    openAPIV3Schema:
      type: object
      required:
        - repository
      properties:
        repository:
          type: object
          description: "Git repository configuration"
          required:
            - url
          properties:
            url:
              type: string
              description: "Git repository URL"
              x-openchoreo-component-parameter-repository-url: true
            secretRef:
              type: string
              default: ""
              description: "Secret reference name for Git credentials"
              x-openchoreo-component-parameter-repository-secret-ref: true
            revision:
              type: object
              default: {}
              properties:
                branch:
                  type: string
                  default: main
                  description: "Git branch to checkout"
                  x-openchoreo-component-parameter-repository-branch: true
                commit:
                  type: string
                  default: ""
                  description: "Git commit SHA or reference (optional, defaults to latest)"
                  x-openchoreo-component-parameter-repository-commit: true
            appPath:
              type: string
              default: "."
              description: "Path to the application directory within the repository"
              x-openchoreo-component-parameter-repository-app-path: true
        testing:
          type: object
          default: {}
          description: "Test step configuration"
          properties:
            image:
              type: string
              default: "golang:1.24-alpine"
              description: "Container image the tests run in. Must contain the toolchain the test command needs."
            command:
              type: string
              default: "go test ./... -coverprofile=/tmp/cover.out && go tool cover -func=/tmp/cover.out | tail -1 | awk '{print $3}' > coverage.txt"
              description: "Shell command that runs the tests, executed from the repository root"
            summaryPath:
              type: string
              default: ""
              description: "Path to a JSON summary the test command writes itself. When set and present, it is used verbatim and nothing else is parsed."
            junitPath:
              type: string
              default: ""
              description: "Path to a JUnit XML report, relative to the repository root. Parsed for test counts."
            coveragePath:
              type: string
              default: "coverage.txt"
              description: "Path to a coverage report. A .xml file is read as Cobertura; anything else is read as a bare percentage."
            reportFormat:
              type: string
              default: ""
              description: "Name of the report format produced, recorded in status.testReport.reportFormat"
            failOnTestFailure:
              type: string
              default: "true"
              enum: ["true", "false"]
              description: "Whether a failing test fails the build. Set to false to always record the summary; see the sample README for the trade-off."
        docker:
          type: object
          default: {}
          description: "Docker build configuration"
          properties:
            context:
              type: string
              default: "."
              description: "Docker build context path relative to the repository root"
            filePath:
              type: string
              default: "./Dockerfile"
              description: "Path to the Dockerfile relative to the repository root"
        buildEnv:
          type: array
          default: []
          description: "Environment variables available during the build (passed as --env to podman build). Reference: https://docs.podman.io/en/stable/markdown/podman-build.1.html#env-env-value"
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
                description: "Environment variable name"
              value:
                type: string
                description: "Environment variable value"
        buildArgs:
          type: array
          default: []
          description: "Docker build arguments declared with ARG in the Dockerfile (passed as --build-arg). Reference: https://docs.podman.io/en/stable/markdown/podman-build.1.html#build-arg-arg-value"
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
                description: "Build argument name"
              value:
                type: string
                description: "Build argument value"
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: ${metadata.namespace}
    spec:
      arguments:
        parameters:
          - name: component-name
            value: ${metadata.labels['openchoreo.dev/component']}
          - name: project-name
            value: ${metadata.labels['openchoreo.dev/project']}
          - name: workflowrun-name
            value: ${metadata.workflowRunName}
          - name: namespace-name
            value: ${metadata.namespaceName}
          - name: git-repo
            value: ${parameters.repository.url}
          - name: branch
            value: ${parameters.repository.revision.branch}
          - name: commit
            value: ${parameters.repository.revision.commit}
          - name: app-path
            value: ${parameters.repository.appPath}
          - name: test-image
            value: ${parameters.testing.image}
          - name: test-command
            value: ${parameters.testing.command}
          - name: test-summary-path
            value: ${parameters.testing.summaryPath}
          - name: test-junit-path
            value: ${parameters.testing.junitPath}
          - name: test-coverage-path
            value: ${parameters.testing.coveragePath}
          - name: test-report-format
            value: ${parameters.testing.reportFormat}
          - name: fail-on-test-failure
            value: ${parameters.testing.failOnTestFailure}
          - name: docker-context
            value: ${parameters.docker.context}
          - name: dockerfile-path
            value: ${parameters.docker.filePath}
          - name: build-env
            value: ${parameters.buildEnv}
          - name: build-args
            value: ${parameters.buildArgs}
          - name: image-name
            value: ${metadata.namespaceName}-${metadata.labels['openchoreo.dev/project']}-${metadata.labels['openchoreo.dev/component']}
          - name: image-tag
            value: v1
          - name: git-secret
            value: ${metadata.workflowRunName}-git-secret
          - name: registry-push-secret
            value: ${metadata.workflowRunName}-registry-push-secret
      serviceAccountName: workflow-sa
      entrypoint: build-workflow
      templates:
        - name: build-workflow
          steps:
            - - name: checkout-source
                templateRef:
                  name: checkout-source
                  clusterScope: true
                  template: checkout
            - - name: run-tests
                templateRef:
                  name: run-tests
                  clusterScope: true
                  template: run-tests
                arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                    - name: test-image
                      value: '{{workflow.parameters.test-image}}'
                    - name: test-command
                      value: '{{workflow.parameters.test-command}}'
                    - name: summary-path
                      value: '{{workflow.parameters.test-summary-path}}'
                    - name: junit-path
                      value: '{{workflow.parameters.test-junit-path}}'
                    - name: coverage-path
                      value: '{{workflow.parameters.test-coverage-path}}'
                    - name: report-format
                      value: '{{workflow.parameters.test-report-format}}'
                    - name: fail-on-test-failure
                      value: '{{workflow.parameters.fail-on-test-failure}}'
            - - name: build-image
                templateRef:
                  name: containerfile-build
                  clusterScope: true
                  template: build-image
                arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                    - name: build-env
                      value: '{{workflow.parameters.build-env}}'
                    - name: build-args
                      value: '{{workflow.parameters.build-args}}'
            - - name: publish-image
                templateRef:
                  name: publish-image
                  clusterScope: true
                  template: publish-image
                arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
            - - name: generate-workload-cr
                templateRef:
                  name: generate-workload
                  clusterScope: true
                  template: generate-workload-cr
                arguments:
                  parameters:
                    - name: image
                      value: '{{steps.publish-image.outputs.parameters.image}}'
                    - name: run-name
                      value: '{{workflow.parameters.workflowrun-name}}'
                    - name: source-commit
                      value: '{{steps.checkout-source.outputs.parameters.commit-sha}}'
                    - name: source-branch
                      value: '{{steps.checkout-source.outputs.parameters.source-branch}}'
                    - name: source-repository
                      value: '{{workflow.parameters.git-repo}}'
                    - name: source-authored-at
                      value: '{{steps.checkout-source.outputs.parameters.commit-authored-at}}'
      volumeClaimTemplates:
        - metadata:
            name: workspace
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
  externalRefs:
    - id: git-secret-reference
      apiVersion: openchoreo.dev/v1alpha1
      kind: SecretReference
      name: ${parameters.repository.secretRef}
  resources:
    - id: git-secret
      includeWhen: ${has(parameters.repository.secretRef) && parameters.repository.secretRef != ""}
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-git-secret
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            kind: ClusterSecretStore
            name: ${workflowplane.secretStore}
          target:
            name: ${metadata.workflowRunName}-git-secret
            creationPolicy: Owner
            template:
              type: ${externalRefs['git-secret-reference'].spec.template.type}
          data: |
            ${externalRefs['git-secret-reference'].spec.data.map(secret, {
              "secretKey": secret.secretKey,
              "remoteRef": {
                "key": secret.remoteRef.key,
                "property": has(secret.remoteRef.property) && secret.remoteRef.property != "" ? secret.remoteRef.property : oc_omit()
              }
            })}
    - id: registry-push-secret
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-registry-push-secret
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${workflowplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${metadata.workflowRunName}-registry-push-secret
            creationPolicy: Owner
            template:
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: "{{ .registrysecret | toString }}"
          data:
            - secretKey: registrysecret
              remoteRef:
                key: registry-push-secret
                property: value
