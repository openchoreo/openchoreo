# An Istio (sidecar) EndpointType for in-cluster, east-west callers. It renders
# one VirtualService whose hosts are the backend components' own Services, so
# callers keep calling the address they already use, and their sidecars apply
# the Endpoint's matches, weighted split and mirrors from ${rules}. Install it
# only on data planes running Istio with sidecars on the callers.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: istio-virtualservice
spec:
  capabilities: [Match, RegularExpression, Mirror, MirrorPercent]
  validations:
    - rule: ${visibility == ["namespace"]}
      message: istio-virtualservice serves in-cluster callers only; set spec.visibility to [namespace], or use istio-http to serve the external gateway as well
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: istio-virtualservice only routes HTTP, GraphQL and Websocket endpoints
    # Every backend serves under one base path: a rule rewrites to, and a mesh
    # match is joined to, its first backend's.
    - rule: ${backends.all(b, b.basePath == backends[0].basePath)}
      message: istio-virtualservice needs every backend to serve under the same base path
  resources:
    - id: virtual-service
      template:
        apiVersion: networking.istio.io/v1
        kind: VirtualService
        metadata:
          name: ${oc_generate_name(metadata.endpointName, "mesh")}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          # Each Service once: Istio refuses a host listed twice.
          hosts: ${backends.map(b, b.serviceName + "." + b.namespace + ".svc.cluster.local").distinct()}
          # One route per rule, first match wins. A path is matched with its
          # regex, because Istio's prefix is a plain string prefix and /next
          # would also match /nextpage. Header names arrive lowercased, as
          # Istio requires, and each header at most once; Host is matched as
          # the authority, since a header named host never matches.
          # Every match names a backend port: the hosts are the backends' own
          # Services, so a route must leave their other ports alone.
          http: |
            ${rules.map(r, {
                "name": r.name,
                "match": size(r.matches) > 0
                  ? r.matches.map(m, backends.map(b, b.port).distinct().map(port, {
                      "port": port,
                      "uri": has(m.path) ? {"regex": (r.backends[0].basePath == "/" ? m.path.regex : r.backends[0].basePath.replace("\\", "\\\\").replace(".", "\\.").replace("+", "\\+").replace("*", "\\*").replace("?", "\\?").replace("(", "\\(").replace(")", "\\)").replace("|", "\\|").replace("[", "\\[").replace("]", "\\]").replace("{", "\\{").replace("}", "\\}").replace("^", "\\^").replace("$", "\\$") + (m.path.regex == "/.*" ? "(/.*)?" : m.path.regex))} : oc_omit(),
                      "authority": m.conditions.exists(h, h.name == "host")
                        ? m.conditions.filter(h, h.name == "host")
                            .map(h, h.type == "Exact" ? {"exact": h.value} : {"regex": h.value})[0]
                        : oc_omit(),
                      "headers": m.conditions.exists(h, h.name != "host")
                        ? m.conditions.filter(h, h.name != "host").transformMapEntry(i, h,
                            {h.name: h.type == "Exact" ? {"exact": h.value} : {"regex": h.value}})
                        : oc_omit()
                    })).flatten()
                  : backends.map(b, b.port).distinct().map(port, {"port": port}),
                "route": r.backends.filter(b, b.weight > 0).map(b, {
                  "destination": {"host": b.serviceName + "." + b.namespace + ".svc.cluster.local",
                                  "port": {"number": b.port}},
                  "weight": b.weight}),
                "mirrors": size(r.mirrors) > 0
                  ? r.mirrors.map(mi, {
                      "destination": {"host": mi.backend.serviceName + "." + mi.backend.namespace + ".svc.cluster.local",
                                      "port": {"number": mi.backend.port}},
                      "percentage": {"value": double(mi.percent)}})
                  : oc_omit()
              })}
