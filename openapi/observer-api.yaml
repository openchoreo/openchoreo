openapi: 3.0.3
info:
  title: OpenChoreo Observer API
  description: |
    The OpenChoreo Observer API provides endpoints for querying logs,
    traces, and metrics from namespaces for components, projects, and environments,
    as well as logs from workflows.
    It integrates with separate observability modules to fetch the actual data via
    API calls to the adaptors provided by the modules.

    This spec covers the observer's **public** API, served on the main server
    port and reachable through the gateway. Every operation here requires a
    Bearer token except `/health`.
  version: 1.0.0
  contact:
    name: OpenChoreo Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: Logs
    description: Log retrieval endpoints
  - name: AuditLogs
    description: Audit trail retrieval endpoints
  - name: Events
    description: Kubernetes event retrieval endpoints
  - name: FinOps
    description: Cost insights and right-sizing recommendation endpoints
  - name: Health
    description: Health check endpoints

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the observer service.
      operationId: health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  error:
                    type: string
                    example: "opensearch: connection failed"

  /.well-known/oauth-protected-resource:
    get:
      tags:
        - Operations
      summary: Get OAuth protected resource metadata
      description: |
        Returns OAuth 2.0 protected resource metadata as defined in RFC 9728,
        describing the observer's `/mcp` endpoint. MCP clients fetch this to
        discover the authorization server and the scopes to request.

        Public by specification: a client must be able to read this before it
        has a token.
      operationId: getOAuthProtectedResourceMetadata
      security: []
      responses:
        "200":
          description: OAuth protected resource metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProtectedResourceMetadata"

  # Logs query endpoint
  /api/v1/logs/query:
    post:
      tags:
        - Logs
      summary: Query logs
      description: Query logs from the observer service
      operationId: queryLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsQueryRequest"
      responses:
        "200":
          description: Logs queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsQueryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "badRequest"
                errorCode: ""
                message: "Missing required fields 'startTime' and 'endTime'"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "unauthorized"
                errorCode: ""
                message: "Invalid or missing token"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "forbidden"
                errorCode: ""
                message: "Subject <xyz> has no permission to view logs of Namespace foo, Project bar, Component baz in Environment development"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "internalServerError"
                errorCode: "OBS-V1-L-29"
                message: ""

