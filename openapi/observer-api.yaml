          type: string
    put:
      tags:
        - Incidents
      summary: Update incident
      description: Update an incident in the observer service
      operationId: updateIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentPutRequest"
      responses:
        "200":
          description: Incident updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPutResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Triggered alerts query endpoint
  /api/v1alpha1/alerts/query:
    post:
      tags:
        - Alerts
      summary: Query alerts
      description: Query alerts from the observer service
      operationId: queryAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertsQueryRequest"
      responses:
        "200":
          description: Alerts queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsQueryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    FinOpsNamespace:
      name: namespace
      in: path
      required: true
      description: Namespace name.
      schema:
        type: string
        example: default
    FinOpsEnvironment:
      name: environment
      in: path
      required: true
      description: Environment name.
      schema:
        type: string
        example: production
    FinOpsProject:
      name: project
      in: query
      required: false
      description: Project name. When set, narrows the response to components in this project.
      schema:
        type: string
        example: gcp-microservices
    FinOpsComponent:
      name: component
      in: query
      required: false
      description: Component name. When set, narrows the response to this single component. Requires `project`.
      schema:
        type: string
        example: checkout-service
    FinOpsStartTime:
      name: startTime
      in: query
      required: true
      description: Inclusive lower bound of the cost window (RFC 3339, second precision).
      schema:
        type: string
        format: date-time
        example: "2026-05-23T10:00:01Z"
    FinOpsEndTime:
      name: endTime
      in: query
      required: true
      description: Exclusive upper bound of the cost window (RFC 3339). Must be strictly greater than startTime.
      schema:
        type: string
        format: date-time
        example: "2026-05-24T10:00:01Z"
    FinOpsGranularity:
      name: granularity
      in: query
      required: false
      description: |
        When present, each component is split into one record per time bucket of
        this size. Uses `<count><unit>` notation where unit is one of `h`
        (hours), `d` (days), or `w` (weeks). For example `1h`, `2d`, `3w`.
      schema:
        type: string
        pattern: "^[1-9][0-9]*[hdw]$"
        example: 1d

    # Platform logs parameters
    PlatformLogsClusterInstance:
      name: clusterInstance
      in: query
      required: false
      description: |
        Clusters the records were collected from, as configured on each logs collector.
        Comma-separated; OR within.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          maxLength: 253
        example: ["cluster1"]
    PlatformLogsNamespace:
      name: namespace
      in: query
      required: false
      description: Kubernetes namespaces of the pods. Comma-separated; OR within.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          maxLength: 253
        example: ["openchoreo-control-plane"]
    PlatformLogsPodName:
      name: podName
      in: query
      required: false
      description: Pod names. Comma-separated; OR within.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          maxLength: 253
        example: ["controller-manager-7f58b689b5-pwsb5"]
    PlatformLogsContainerName:
      name: containerName
      in: query
      required: false
      description: Container names. Comma-separated; OR within.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          maxLength: 253
        example: ["manager"]
    PlatformLogsLabels:
      name: labels
      in: query
      required: false
      description: |
        Kubernetes label selector over the pod labels on each record. Comma means AND
        here, matching `kubectl -l`. Equality-based selectors only (`key=value`); set-based
        operators are not supported. This is how plane attribution is expressed, for
        example `openchoreo.dev/plane=controlplane,app.kubernetes.io/name=openbao`.
      schema:
        type: string
        maxLength: 256
        example: openchoreo.dev/plane=controlplane
    PlatformLogsLogLevels:
      name: logLevels
      in: query
      required: false
      description: |
        Log severities to include. Comma-separated; OR within. Named to match
        `LogsQueryRequest.logLevels` on the component and workflow endpoints.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        example: ["ERROR", "WARN"]
    PlatformLogsSearchPhrase:
      name: searchPhrase
      in: query
      required: false
      description: |
        Text to search for within log messages. Entries not containing the phrase are
        excluded.
      schema:
        type: string
        maxLength: 256
        example: reconcile failed
    PlatformLogsStartTime:
      name: startTime
      in: query
      required: true
      description: Inclusive lower bound of the log window (RFC 3339, absolute UTC).
      schema:
        type: string
        format: date-time
        example: "2026-08-14T16:30:00Z"
    PlatformLogsEndTime:
      name: endTime
      in: query
      required: true
      description: |
        Exclusive upper bound of the log window (RFC 3339, absolute UTC). Must be strictly
        greater than startTime.
      schema:
        type: string
        format: date-time
        example: "2026-08-14T17:30:00Z"
    PlatformLogsLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of log entries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    PlatformLogsSortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort direction on the log timestamp.
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  schemas:
    # Request schemas for logs
    ComponentSearchScope:
      type: object
      properties:
        namespace:
          type: string
        project:
          type: string
        component:
          type: string
        environment:
          type: string
      required: [namespace]

    WorkflowSearchScope:
      type: object
      properties:
        namespace:
          type: string
        workflowRunName:
          type: string
        taskName:
          type: string
      required: [namespace]

    LogsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          oneOf:
            - $ref: "#/components/schemas/ComponentSearchScope"
            - $ref: "#/components/schemas/WorkflowSearchScope"
        logLevels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        searchPhrase:
          type: string
      required: [startTime, endTime, searchScope]

    # Response schemas for logs
    LogEntryMetadata:
      type: object
      description: The metadata of the log entry
      properties:
        componentName:
          type: string
          description: The OpenChoreo component name that generated the log
        projectName:
          type: string
          description: The OpenChoreo project name that generated the log
        environmentName:
          type: string
          description: The OpenChoreo environment name that generated the log
        namespaceName:
          type: string
          description: The OpenChoreo namespace name that generated the log
        componentUid:
          type: string
          description: The OpenChoreo component UID that generated the log
          format: uuid
        projectUid:
          type: string
          description: The OpenChoreo project UID that generated the log
          format: uuid
        environmentUid:
          type: string
          description: The OpenChoreo environment UID that generated the log
          format: uuid
        containerName:
          type: string
          description: The container name that generated the log
        podName:
          type: string
          description: The Kubernetes pod name that generated the log
        podNamespace:
          type: string
          description: The namespace of the Kubernetes pod that generated the log

    # One entry type for both component- and workflow-scoped queries, matching
    # types.LogEntry, which already serves both paths.
    #
    # This is deliberately not a oneOf over separate component and workflow
    # schemas. Which fields are populated depends on the request's searchScope,
    # and a response schema cannot condition on the request: the payload carries
    # no discriminator, so a oneOf would claim the arms are distinguishable from
    # the response alone when they are not.
    LogEntry:
      type: object
      description: >-
        A single log entry. timestamp and log are always present. level and
        metadata are present when the queried scope provides them — component
        queries populate both; workflow queries currently populate neither.
      required: [timestamp, log]
      properties:
        timestamp:
          type: string
          description: The timestamp of the log entry
          format: date-time
        log:
          type: string
          description: The log message
        level:
          type: string
          description: The log level
        metadata:
          $ref: "#/components/schemas/LogEntryMetadata"

    LogsQueryResponse:
      type: object
      properties:
        logs:
          type: array
          description: The logs queried successfully
          items:
            $ref: "#/components/schemas/LogEntry"
        total:
          type: integer
          description: The total number of matching log entries, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the logs in milliseconds

    # Cluster log schemas
    PlatformLog:
      type: object
      description: |
        A single log record: the message plus the physical coordinates, pod metadata and
        pod labels of whatever produced it.
      required:
        - timestamp
        - log
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry in UTC.
        log:
          type: string
          description: |
            The log message. Named `log` rather than `message` to match ComponentLogEntry
            and WorkflowLogEntry.
        level:
          type: string
          description: |
            Log severity, derived from the message text by the adapter. Absent when the
            adapter cannot determine one.
        clusterInstance:
          type: string
          description: Cluster the record was collected from, stamped by the logs collector.
        namespaceName:
          type: string
          description: Kubernetes namespace of the pod that produced the log.
        podName:
          type: string
        containerName:
          type: string
        podIp:
          type: string
          description: IP address of the pod that produced the log.
        nodeName:
          type: string
          description: Node the pod was scheduled on.
        containerImage:
          type: string
          description: Image the container was running.
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Pod labels carried on the record. Returned as well as filtered on: `labels`
            narrows the query, and this shows what else is on the pod.

    PlatformLogsResponse:
      type: object
      required:
        - tookMs
        - total
        - logs
      properties:
        logs:
          type: array
          description: Log entries matching the query.
          items:
            $ref: "#/components/schemas/PlatformLog"
        total:
          type: integer
          format: int64
          minimum: 0
          description: The total number of matching log entries, capped at 1000.
        tookMs:
          type: integer
          format: int64
          minimum: 0
          description: The time taken to query the logs in milliseconds.

    # Request schema for audit logs
    AuditLogsQueryRequest:
      type: object
      description: |
        A filter set over the audit trail, shaped like the record it filters. Every
        filter is named and nested exactly as the field it matches in
        `AuditLogRecord` — `actor.id` filters `actor.id` — so a client needs no
        translation table in either direction, and a filter picker built from the
        record's own field paths maps onto this body mechanically.

        That is why the record-derived filters keep the record's snake_case spelling
        (`operation_id`, `request_id`, `source_ip`) while the query's own controls stay
        camelCase (`startTime`, `searchPhrase`, `limit`, `includeTimeline`). The two
        casings mark the two kinds of field: one names something in the trail, the
        other names something about this request.

        Multi-value fields OR within a field; fields AND with each other. An absent
        field is not a filter.

        The tenancy filters under `resource` narrow the result set and nothing else.
        Authorization is evaluated at cluster scope before any of them is read, so
        naming a namespace here does not entitle the caller to that namespace's trail.

        Two record fields have no filter. `resource.uid` is absent on deletes and on
        non-CRUD mutations, so filtering by it would silently exclude the operations an
        investigation most often wants — filter by `resource.name` and read `uid` off
        the returned record. `resource.resource`, the fourth hierarchy level, is set
        only where it duplicates `resource.name` today, so a filter for it would be a
        second spelling of one already here.
      properties:
        startTime:
          type: string
          description: Inclusive lower bound of the event window (RFC 3339, absolute UTC).
          format: date-time
          example: "2026-08-14T16:30:00Z"
        endTime:
          type: string
          description: |
            Exclusive upper bound of the event window (RFC 3339, absolute UTC). Must be
            strictly greater than startTime.
          format: date-time
          example: "2026-08-14T17:30:00Z"
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of records to return.
        sortOrder:
          type: string
          description: Sort direction on the event time.
          enum:
            - asc
            - desc
          default: desc
        cursor:
          type: string
          maxLength: 4096
          description: |
            Opaque continuation token from a previous response's `nextCursor`. Minted and
            interpreted by the adapter behind this observer; pass it back unmodified.

            Continuing with a cursor pins the ordering, so a record written mid-scroll
            cannot shift a page boundary. A cursor eventually expires — the backend's
            point-in-time lapses, or the indices it was minted against roll — and that
            comes back as a `400` carrying the cursor-expired error code, not as an empty
            page. Restart the query from the first page when it does.
        includeTimeline:
          type: boolean
          default: false
          description: |
            Also return per-interval counts across the queried window, broken down by
            `result`. See `AuditLogTimeline`.

            No page of records can be bucketed into a timeline — a page is the newest
            or oldest `limit` records, not a sample of the window — so a client that
            wants a histogram has to ask for one.

            Opt-in because it costs an aggregation pass on top of the search, and the
            answer describes the query rather than the page: a client paginating should
            request it on the first page only, since it does not change as the cursor
            is walked.

            There is deliberately no companion flag for filter values — the distinct
            values each filter can take under the query. Those need one aggregation per
            filter rather than one in total, which on a busy trail is enough load to
            matter on every keystroke that changes a query. They are planned as their
            own operation, where a client can ask for one filter's values at a time and
            the cost is proportional to what it actually needs.
        timelineInterval:
          type: string
          pattern: "^[1-9][0-9]*[mhdw]$"
          description: |
            Bucket width for `timeline`, in `<count><unit>` notation where unit is one
            of `m` (minutes), `h` (hours), `d` (days) or `w` (weeks) — for example
            `15m`, `2h`, `1d`. Extends the `<count><unit>` convention used elsewhere in
            this spec with `m`, since a one-hour window wants minute buckets.

            Ignored unless `includeTimeline` is true. Defaults to a width the adapter
            chooses from the window when omitted.

            A width that would produce more than 500 buckets is **coarsened rather than
            rejected**, and `timeline.interval` reports what was actually used — always
            read the width back from there rather than assuming the request was honoured.
          example: 15m
        actor:
          $ref: "#/components/schemas/AuditLogsActorFilter"
        resource:
          $ref: "#/components/schemas/AuditLogsResourceFilter"
        action:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Semantic action names.
          items:
            type: string
            maxLength: 253
          example: ["create_project", "delete_component"]
        category:
          type: array
          uniqueItems: true
          maxItems: 2
          description: |
            Event categories. A closed set: an unknown value is a `400` rather than a
            filter that silently matches nothing.
          items:
            type: string
            enum: ["management", "authorization"]
          example: ["authorization"]
        result:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Outcomes. Closed, for the same reason as `category`.
          items:
            type: string
            enum: ["success", "failure", "denied", "unauthenticated"]
          example: ["denied"]
        producer:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Emitting services.
          items:
            type: string
            maxLength: 253
          example: ["openchoreo-api"]
        surface:
          type: array
          uniqueItems: true
          maxItems: 2
          description: |
            Surfaces of the API the call arrived through. Closed. MCP wraps the same
            API, so the REST value is `rest` rather than `api`.
          items:
            type: string
            enum: ["rest", "mcp"]
          example: ["rest"]
        operation_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Canonical operation identifiers.
          items:
            type: string
            maxLength: 253
          example: ["CreateProject"]
        request_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Correlation IDs. This is the pivot from an access log line to the audit
            record for the same request, so it takes exact IDs rather than a prefix.
          items:
            type: string
            maxLength: 253
        event_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Record identifiers, for fetching known records directly.
          items:
            type: string
            maxLength: 253
        source_ip:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Client addresses. Matched exactly, not by network range — a CIDR filter is
            not offered because the recorded value is whatever the request arrived
            with, which behind a proxy is the proxy.
          items:
            type: string
            maxLength: 253
        user_agent:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Client identifications, matched exactly. Free-text agent strings vary by
            version, so `searchPhrase` is usually the better tool for "anything occ"
            — this filter is for pinning down one exact agent.
          items:
            type: string
            maxLength: 512
        searchPhrase:
          type: string
          maxLength: 256
          description: Free text to match within the record.
      required: [startTime, endTime]

    AuditLogsActorFilter:
      type: object
      description: |
        Filters on the record's `actor` group. Named and nested as the record is, so
        `actor.id` here filters `actor.id` there.
      properties:
        id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Subject identifiers. An `id` is unique only within an `issuer`, so on a
            deployment with more than one identity provider this should be paired with
            `issuer` — filtering on `id` alone would conflate two different subjects
            that happen to share a `sub`.
          items:
            type: string
            maxLength: 253
          example: ["alice@example.com"]
        type:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Kinds of subject, e.g. `user`, `service_account`, `anonymous`.
          items:
            type: string
            maxLength: 64
          example: ["user", "service_account"]
        issuer:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Token issuers — the namespace an `id` is unique within. On a single-issuer
            deployment this is one value and filtering on it is redundant; on a
            multi-issuer one it is what makes an `id` filter mean one subject.
          items:
            type: string
            maxLength: 512
        session_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Identity-provider session identifiers, from the token's `sid` claim. This
            is what joins every action taken in one login into a single sequence.

            Present for interactive logins and absent for client-credentials tokens,
            since OIDC leaves `sid` optional — so a session filter selects human
            activity and silently excludes service accounts.
          items:
            type: string
            maxLength: 253
        entitlements:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Entitlement values, e.g. a group name. Matched against the values of every
            claim in the record's `actor.entitlements` map rather than one named claim,
            because the claim key varies by subject kind — `groups` for a user, `sub`
            for a service account — and a caller asking "what did everyone in
            `platform-engineer` do" should not have to know which.
          items:
            type: string
            maxLength: 253
          example: ["platform-engineer"]

    AuditLogsResourceFilter:
      type: object
      description: |
        Filters on the record's `resource` group — the target of the action and the
        point in OpenChoreo's tree the decision was authorized at. Named and nested as
        the record is.

        These are filters, not scopes: see `AuditLogsQueryRequest`.
      properties:
        type:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Resource kinds.
          items:
            type: string
            maxLength: 253
          example: ["project"]
        namespace:
          type: array
          uniqueItems: true
          maxItems: 20
          description: OpenChoreo namespaces.
          items:
            type: string
            maxLength: 253
          example: ["default"]
        environment:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Environments in the dual-scoped `{namespace}/{name}` form, because that is
            how the value is stored — recorded exactly as authorization evaluated it. A
            bare environment name will not match.
          items:
            type: string
            maxLength: 507
          example: ["default/development"]
        project:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Projects.
          items:
            type: string
            maxLength: 253
        component:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Components.
          items:
            type: string
            maxLength: 253
        name:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Resource names, as the handler recorded them.
          items:
            type: string
            maxLength: 253

    AuditLogFilterValuesRequest:
      type: object
      description: |
        Which filter to list values for, and the query to list them under.

        `query` is a full `AuditLogsQueryRequest`, in the same shape as a record
        query — so a client sends the query it already holds rather than rebuilding
        it.

        **The time window lives in `query`, and it is required.** `query.startTime`
        and `query.endTime` are mandatory on `AuditLogsQueryRequest`, so every call
        here is scoped to a period and there is no way to ask for the distinct values
        across all of history — which on a trail with years of retention is not a
        question any backend should be asked. Values are the ones reachable in that
        window, exactly as the records are.

        The other filters in `query` narrow which records the values are drawn from,
        except the one named by `filter`, whose own selections are ignored.

        `query.limit`, `query.sortOrder`, `query.cursor`, `query.includeTimeline` and
        `query.timelineInterval` carry no meaning here: no records are returned, so
        there is nothing to page, order or bucket. They are accepted and ignored
        rather than rejected, so a client can pass its query through untouched.
      required:
        - query
        - filter
      properties:
        query:
          $ref: "#/components/schemas/AuditLogsQueryRequest"
        filter:
          type: string
          description: |
            The filter to list values for, named by its path in
            `AuditLogsQueryRequest` — `actor.id` lists the values that filter accepts.

            `event_id` and `request_id` are absent: both are near-unique per record, so
            a list of them is not something a client picks from — they are filtered by
            an exact value the client already holds, from a log line or another record.
            `actor.session_id` is present despite being near-unique too, because
            `valueSearch` makes it reachable: an investigator narrowing to one session
            has a prefix to type, which is not true of a UUID they have never seen.
          enum:
            - actor.id
            - actor.type
            - actor.issuer
            - actor.session_id
            - actor.entitlements
            - resource.type
            - resource.namespace
            - resource.environment
            - resource.project
            - resource.component
            - resource.name
            - action
            - category
            - result
            - producer
            - surface
            - operation_id
            - source_ip
            - user_agent
          example: actor.id
        valueSearch:
          type: string
          maxLength: 256
          description: |
            Return only values containing this text, case-insensitively. This is how a
            picker narrows as its user types, and it is what makes a high-cardinality
            filter usable at all: `actor.id` on a large deployment has more distinct
            values than any list should offer, and typing three characters cuts it to
            something choosable.

            Distinct from `query.searchPhrase`, which narrows the *records* considered.
            This narrows the *values* returned from those records.
          example: ali
        maxValues:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: |
            The maximum number of values to return, ordered by `count` descending then
            `value` ascending — so a truncated list holds the busiest values.

            Named `maxValues` rather than `limit` to keep it distinct from
            `query.limit`, which is a page size for records and is ignored here.

    AuditLogFilterValuesResponse:
      type: object
      required:
        - filter
        - values
        - totalValues
        - totalRelation
        - tookMs
      properties:
        filter:
          type: string
          description: |
            The filter these values belong to, echoed from the request so a client
            handling several pickers can match a response to the one that asked.
        values:
          type: array
          description: |
            The distinct values, ordered by `count` descending then `value` ascending.

            Values on which the field is absent are not represented: there is no
            empty-string entry, because there is no filter value that would select one.
            A denial that resolved no operation contributes to no `resource.name` value
            at all rather than to an empty one.
          items:
            $ref: "#/components/schemas/AuditLogFilterValue"
        totalValues:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many distinct values match, of which at most `maxValues` were returned.
            Read together with `totalRelation` — this is what lets a picker say "412
            more values, keep typing to narrow" rather than silently ending its list.
        totalRelation:
          type: string
          enum: [eq, gte]
          description: |
            Whether `totalValues` is exact (`eq`) or a lower bound (`gte`). Counting
            distinct values exactly is itself an expensive aggregation on a
            high-cardinality field, and most backends answer approximately, so a
            capped or estimated count is labelled rather than passed off as exact.
        tookMs:
          type: integer
          format: int64
          minimum: 0
          description: The time taken to compute the values in milliseconds.

    AuditLogFilterValue:
      type: object
      description: One value a filter takes, with how many records carry it.
      required:
        - value
        - count
      properties:
        value:
          type: string
          description: The value, exactly as it would be sent back as a filter.
          example: alice@example.com
        count:
          type: integer
          format: int64
          minimum: 1
          description: |
            Matching records carrying this value, within the queried window. May be
            approximate on a high-cardinality filter where the backend answers from a
            partial term count, so treat it as an ordering hint and a sense of scale —
            never as an audit finding in its own right.
          example: 412

    # Response schemas for audit logs
    AuditLogRecord:
      type: object
      description: |
        One audit event, in the field names and nesting it was published with. Keys are
        snake_case here while the surrounding envelope is camelCase, and that is
        deliberate: this is the frozen, versioned record a SIEM already consumes, so a
        response body can be compared against an exported log line key for key rather
        than through a translation table.

        `category` and `result` are plain strings rather than enums, unlike their
        request-side counterparts: a filter is a closed input the server validates, while
        a record's vocabulary grows with `schema_version`, and a closed enum here would
        make an older client reject a newer record.
      required:
        - schema_version
        - event_id
        - event_time
        - actor
        - action
        - category
        - result
      properties:
        schema_version:
          type: string
          description: |
            Schema of this record. `major.minor`; major on a field removal or a changed
            value representation, minor on an addition.
          example: "1.0"
        event_id:
          type: string
          description: UUID v7, unique per record.
        event_time:
          type: string
          format: date-time
          description: When the audited request was received.
        actor:
          $ref: "#/components/schemas/AuditLogActor"
        action:
          type: string
          description: Semantic action name.
          example: create_project
        category:
          type: string
          description: Event category. `management` or `authorization` at schema 1.0.
        result:
          type: string
          description: |
            Outcome. `success`, `failure`, `denied` (an authenticated subject refused by
            policy) or `unauthenticated` (no subject at all) at schema 1.0.
        request_id:
          type: string
          description: Correlates this record with the access log line for the same request.
        source_ip:
          type: string
          description: Client address the request arrived from.
        user_agent:
          type: string
          description: |
            Client-supplied and unverifiable, like `source_ip`. It is the only field
            that separates a portal session from occ, CI or an agent, which is what
            makes it worth recording despite being unverifiable.
          example: occ/1.2.0
        producer:
          type: string
          description: Emitting service.
          example: openchoreo-api
        surface:
          type: string
          description: |
            Which surface of the API the call arrived through. `rest` or `mcp` at
            schema 1.0 — MCP wraps the same API, so the REST value is not `api`.
        operation_id:
          type: string
          description: Canonical operation identifier.
          example: CreateProject
        http:
          $ref: "#/components/schemas/AuditLogHTTPInfo"
        resource:
          $ref: "#/components/schemas/AuditLogResource"
        metadata:
          type: object
          additionalProperties: true
          description: Operation-specific detail, when the emitting handler recorded any.
        collector:
          $ref: "#/components/schemas/AuditLogCollectorInfo"
        log:
          type: string
          description: |
            The raw line the collector ingested, preserved alongside the parsed fields.
            Present when the storage backend retains it. This is the ground truth a
            parsing discrepancy is settled against.

    AuditLogActor:
      type: object
      description: |
        Who performed the action. `id` is unique only within `issuer` — the same `sub`
        from two identity providers is two different subjects.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: e.g. `user`, `service_account`, `anonymous`.
        id:
          type: string
          description: The token's validated `sub` claim, or `anonymous`.
        issuer:
          type: string
          description: The token's `iss` claim; the namespace `id` is unique within.
        session_id:
          type: string
          description: |
            The token's `sid` claim, joining this event to an identity-provider login.
        entitlements:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Entitlements carried on the token, when the issuer supplies any.

    AuditLogHTTPInfo:
      type: object
      description: |
        The request line, for an event that arrived over HTTP. Absent for an MCP
        `tools/call`, which has none.
      properties:
        method:
          type: string
        path:
          type: string
          description: Route path only; query strings are not recorded.

    AuditLogResource:
      type: object
      description: |
        The target resource, and the point in OpenChoreo's tree the decision was
        authorized at. Absent on a rejection that resolved no operation.
      properties:
        type:
          type: string
        namespace:
          type: string
        environment:
          type: string
          description: Dual-scoped `{namespace}/{name}`, as authorization evaluated it.
        project:
          type: string
        component:
          type: string
        resource:
          type: string
        uid:
          type: string
          description: |
            Server-generated identifier that is never reused. Absent when the operation
            returned no object — a delete, or a non-CRUD mutation.
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true

    AuditLogCollectorInfo:
      type: object
      description: |
        Where the record was collected from, as stamped by the collector rather than by
        the emitting service. Cross-checks `producer`: a mismatch between the two means a
        record's claimed origin and its actual one disagree.
      properties:
        namespaceName:
          type: string
        podName:
          type: string
        containerName:
          type: string

    AuditLogsResponse:
      type: object
      required:
        - records
        - total
        - totalRelation
        - tookMs
      properties:
        records:
          type: array
          description: Audit records matching the query, in `sortOrder` of `event_time`.
          items:
            $ref: "#/components/schemas/AuditLogRecord"
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of matching records. Read together with `totalRelation`.
        totalRelation:
          type: string
          enum: [eq, gte]
          description: |
            Whether `total` is exact (`eq`) or a lower bound the backend stopped counting
            at (`gte`). Present so a capped count cannot silently claim to be exact — an
            audit consumer reading a capped `total` as exact draws the wrong conclusion
            about how much happened.
        tookMs:
          type: integer
          format: int64
          minimum: 0
          description: The time taken to query the audit logs in milliseconds.
        nextCursor:
          type: string
          maxLength: 4096
          description: |
            Opaque token for the next page. Absent when this page is the last one; its
            absence is the only end-of-results signal.
        timeline:
          $ref: "#/components/schemas/AuditLogTimeline"

    AuditLogTimeline:
      type: object
      description: |
        Per-interval counts across the queried window, broken down by `result`.

        Present only when `includeTimeline=true`, and omitted rather than empty when
        the adapter backing this observer cannot compute it — a client must treat an
        absent `timeline` as "unknown", not as "no activity in this window".
      required:
        - interval
        - buckets
      properties:
        interval:
          type: string
          pattern: "^[1-9][0-9]*[mhdw]$"
          description: |
            The bucket width actually used, which is not necessarily the requested
            `timelineInterval`: a width that would exceed 500 buckets is coarsened.
            Read the width from here, and label the chart from here.
          example: 15m
        buckets:
          type: array
          description: |
            One entry per interval, in ascending `startTime` order regardless of the
            query's `sortOrder` — a timeline reads left to right whichever way the
            records are paged.

            **Buckets with no records are present with zero counts, not omitted.** The
            array covers the whole window from `startTime` to `endTime` contiguously.
            A sparse array would let a client draw a continuous chart across a gap in
            activity, which is the same class of mistake as answering an unimplemented
            query with an empty `200`: it reports quiet as if it were nothing to
            report. The final bucket may be shorter than `interval` where the window
            does not divide evenly.
          items:
            $ref: "#/components/schemas/AuditLogTimelineBucket"

    AuditLogTimelineBucket:
      type: object
      description: One interval of the timeline.
      required:
        - startTime
        - total
      properties:
        startTime:
          type: string
          format: date-time
          description: Inclusive lower bound of the bucket. Its width is `interval`.
          example: "2026-09-03T20:00:00Z"
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Records in this bucket. Equals the sum of `counts` — carried separately so
            a client can draw a total without walking the breakdown, and so a bucket
            whose breakdown the backend could not produce still reports a height.
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          description: |
            Records in this bucket by `result`, keyed by the value itself — `success`,
            `failure`, `denied` and `unauthenticated` at schema 1.0. An open map rather
            than four declared fields, so a `result` value added in a later schema
            appears here without a spec bump.

            **A result with no records in this bucket may be omitted, and an absent key
            means zero.** A client renders the full set of results it knows about and
            reads a missing key as 0.
          example:
            success: 71
            denied: 9
            failure: 4

    # Request schema for events
    EventsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          oneOf:
            - $ref: "#/components/schemas/ComponentSearchScope"
            - $ref: "#/components/schemas/WorkflowSearchScope"
      required: [startTime, endTime, searchScope]

    # Response schemas for events
    EventEntry:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the event
          format: date-time
        message:
          type: string
          description: The event message
        type:
          type: string
          description: The event type (e.g. Normal, Warning)
        reason:
          type: string
          description: The short, machine-readable reason for the event (e.g. SawCompletedJob)
        metadata:
          type: object
          description: The metadata of the event
          properties:
            componentName:
              type: string
              description: The OpenChoreo component name the event is associated with
            projectName:
              type: string
              description: The OpenChoreo project name the event is associated with
            environmentName:
              type: string
              description: The OpenChoreo environment name the event is associated with
            namespaceName:
              type: string
              description: The OpenChoreo namespace name the event is associated with
            componentUid:
              type: string
              description: The OpenChoreo component UID the event is associated with
              format: uuid
            projectUid:
              type: string
              description: The OpenChoreo project UID the event is associated with
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID the event is associated with
              format: uuid
            objectKind:
              type: string
              description: The kind of the Kubernetes object the event involves (e.g. CronJob)
            objectName:
              type: string
              description: The name of the Kubernetes object the event involves
            objectNamespace:
              type: string
              description: The namespace of the Kubernetes object the event involves

    EventsQueryResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventEntry"
          description: The events queried successfully
        total:
          type: integer
          description: The total number of matching events, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the events in milliseconds

    # Request schemas for metrics
    MetricsQueryRequest:
      type: object
      properties:
        metric:
          type: string
          description: The type of query to execute
          enum:
            - resource
            - http
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        step:
          type: string
          description: The step of the query to determine the number of points to return. E.g. 1m, 5m, 15m, 30m, 1h
        searchScope:
          $ref: "#/components/schemas/ComponentSearchScope"
      required: [metric, startTime, endTime, searchScope]

    # Response schemas for metrics
    MetricsTimeSeriesItem:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the time series item
          format: date-time
        value:
          type: number
          format: double
          description: The value of the time series item

    ResourceMetricsTimeSeries:
      type: object
      properties:
        cpuUsage:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        cpuRequests:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        cpuLimits:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        memoryUsage:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        memoryRequests:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        memoryLimits:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        networkReceiveBytes:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        networkTransmitBytes:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        diskReadBytes:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        diskWriteBytes:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"

    HttpMetricsTimeSeries:
      type: object
      properties:
        requestCount:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        successfulRequestCount:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        unsuccessfulRequestCount:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        meanLatency:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        latencyP50:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        latencyP90:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"
        latencyP99:
          type: array
          items:
            $ref: "#/components/schemas/MetricsTimeSeriesItem"

    MetricsQueryResponse:
      oneOf:
        - $ref: "#/components/schemas/ResourceMetricsTimeSeries"
        - $ref: "#/components/schemas/HttpMetricsTimeSeries"

    # Schemas for the runtime topology endpoint
    RuntimeTopologySearchScope:
      allOf:
        - $ref: "#/components/schemas/ComponentSearchScope"
      required: [namespace, project, environment]

    RuntimeTopologyRequest:
      type: object
      description: |
        Request body for POST /api/v1alpha1/metrics/runtime-topology.
        searchScope must include namespace, project, and environment — runtime
        topology is project- and environment-scoped. The optional component
        field, if set, restricts results to edges that touch that component.
      properties:
        searchScope:
          $ref: "#/components/schemas/RuntimeTopologySearchScope"
        startTime:
          type: string
          description: The start time of the query window
          format: date-time
        endTime:
          type: string
          description: The end time of the query window
          format: date-time
        includeGateways:
          type: boolean
          description: Whether to include gateway -> component edges. Defaults to true.
          default: true
        includeExternal:
          type: boolean
          description: |
            Whether to include edges to/from components outside the requested
            project (cross-project or off-platform). Defaults to true.
          default: true
      required: [searchScope, startTime, endTime]

    RuntimeTopologyMetrics:
      type: object
      description: |
        Aggregate HTTP metrics over the requested time window.
        Latency values are in seconds (consistent with /api/v1/metrics/query).
      properties:
        requestCount:
          type: number
          format: double
          description: Total number of HTTP requests observed in the window.
        unsuccessfulRequestCount:
          type: number
          format: double
          description: Number of unsuccessful (non-2xx) HTTP requests in the window.
        meanLatency:
          type: number
          format: double
          description: Mean request latency, in seconds.
        latencyP50:
          type: number
          format: double
          description: 50th percentile request latency, in seconds.
        latencyP90:
          type: number
          format: double
          description: 90th percentile request latency, in seconds.
        latencyP99:
          type: number
          format: double
          description: 99th percentile request latency, in seconds.

    RuntimeTopologyNodeRef:
      type: object
      description: |
        Reference to a node in the runtime topology. The shape depends on `kind`:
        - kind=component: `componentUid` is always populated when the data
          comes from an HTTP-metrics backend; `component` (name) is filled
          when the observer can resolve it.
        - kind=gateway:   `name` is required (e.g. "internet", "intranet").
        - kind=external:  at least one of `host` or `component`/`componentUid`
          should be set; `project`/`projectUid` is included when the source
          is in a different project.
      properties:
        kind:
          type: string
          enum: [component, gateway, external]
        component:
          type: string
          description: Component name (when kind=component, or for external cross-project sources).
        componentUid:
          type: string
          format: uuid
          description: |
            OpenChoreo component UID. Populated from the metrics backend; useful
            for stable matching when the human-readable name is unavailable.
        service:
          type: string
          description: Workload endpoint name (when kind=component).
        name:
          type: string
          description: Gateway name (when kind=gateway).
        host:
          type: string
          description: Host (when kind=external).
        project:
          type: string
          description: Project name (when kind=external and the source is in a different project).
        projectUid:
          type: string
          format: uuid
          description: OpenChoreo project UID.
        namespace:
          type: string
          description: Namespace the node lives in.
      required: [kind]

    RuntimeTopologyNode:
      type: object
      description: A node observed in the runtime topology, with its aggregated metrics.
      properties:
        kind:
          type: string
          enum: [component, gateway, external]
        component:
          type: string
        componentUid:
          type: string
          format: uuid
        service:
          type: string
        name:
          type: string
        host:
          type: string
        project:
          type: string
        projectUid:
          type: string
          format: uuid
        namespace:
          type: string
        metrics:
          $ref: "#/components/schemas/RuntimeTopologyMetrics"
      required: [kind]

    RuntimeTopologyEdge:
      type: object
      description: An observed traffic flow from a source node to a target node.
      properties:
        id:
          type: string
          description: |
            Stable identifier for the edge. Convention:
            - component->component: `${srcComponent}:${srcService}->${dstComponent}:${dstService}`
            - gateway->component:   `gateway:${gatewayName}->${dstComponent}:${dstService}`
            - component->external:  `${srcComponent}:${srcService}->external:${host}`
        source:
          $ref: "#/components/schemas/RuntimeTopologyNodeRef"
        target:
          $ref: "#/components/schemas/RuntimeTopologyNodeRef"
        protocol:
          type: string
          description: Wire protocol of the observed traffic.
          enum: [http]
        metrics:
          $ref: "#/components/schemas/RuntimeTopologyMetrics"
      required: [id, source, target]

    RuntimeTopologySummary:
      type: object
      description: Metadata describing the query window the response was computed for.
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
      required: [startTime, endTime, generatedAt]

    RuntimeTopologyResponse:
      type: object
      description: |
        The runtime topology response. Nodes and edges contain only entities for
        which traffic was observed during the requested time window. Static topology
        (workload dependency graph) is NOT included in this response; it must be
        fetched separately from the OpenChoreo API.
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeTopologyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeTopologyEdge"
        summary:
          $ref: "#/components/schemas/RuntimeTopologySummary"
      required: [summary]

    # Request schemas for traces
    TracesQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          $ref: "#/components/schemas/ComponentSearchScope"
        includeAttributes:
          type: boolean
          description: Whether to include span attributes in the response. Defaults to false.
          default: false
      required: [startTime, endTime, searchScope]

    # Response schemas for traces
    TraceInfo:
      type: object
      description: Summary of a single trace.
      properties:
        traceId:
          type: string
          description: The trace ID
        traceName:
          type: string
          description: The name of the trace
        spanCount:
          type: integer
          description: The number of spans in the trace
        rootSpanId:
          type: string
        rootSpanName:
          type: string
        rootSpanKind:
          type: string
        startTime:
          type: string
          description: The start time of the trace
          format: date-time
        endTime:
          type: string
          description: The end time of the trace
          format: date-time
        durationNs:
          type: integer
          format: int64
          description: The duration of the trace in nanoseconds
        hasErrors:
          type: boolean
          description: Whether any span in the trace has an error status.

    TracesQueryResponse:
      type: object
      properties:
        traces:
          type: array
          description: The list of traces
          items:
            $ref: "#/components/schemas/TraceInfo"
        total:
          type: integer
          description: The total number of matching traces, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the traces in milliseconds

    # One span shape, referenced by both the span-list and span-detail responses.
    # They were written out separately and had already drifted: the list copy
    # described spanKind as "The name of the span".
    SpanInfo:
      type: object
      description: A single span within a trace.
      properties:
        spanId:
          type: string
          description: The span ID
        spanName:
          type: string
          description: The name of the span
        spanKind:
          type: string
          description: The kind of the span
        startTime:
          type: string
          description: The start time of the span
          format: date-time
        endTime:
          type: string
          description: The end time of the span
          format: date-time
        durationNs:
          type: integer
          format: int64
          description: The duration of the span in nanoseconds
        parentSpanId:
          type: string
          description: The parent span ID
        status:
          $ref: "#/components/schemas/SpanStatus"
        attributes:
          type: object
          description: The span attributes
          additionalProperties: true
        resourceAttributes:
          type: object
          description: The resource attributes
          additionalProperties: true

    TraceSpansQueryResponse:
      type: object
      properties:
        spans:
          type: array
          description: The list of spans
          items:
            $ref: "#/components/schemas/SpanInfo"
        total:
          type: integer
          description: The total number of matching spans, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the spans in milliseconds

    TraceSpanDetailsResponse:
      $ref: "#/components/schemas/SpanInfo"

    # OpenTelemetry span status (code + optional message)
    SpanStatus:
      type: object
      description: >-
        Execution status of the span, following the OpenTelemetry span Status
        model.
      properties:
        code:
          type: string
          enum:
            - ok
            - error
            - unset
          description: The status code of the span. One of "ok", "error", or "unset".
        message:
          type: string
          description: >-
            Developer-facing human-readable status description. Typically set
            only when code is "error".

    # Request schema for alerts query
    AlertsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          description: The maximum number of items to return
          default: 100
          minimum: 1
          maximum: 1000
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          $ref: "#/components/schemas/ComponentSearchScope"
      required: [startTime, endTime, searchScope]

    # The OpenChoreo resource an alert or incident belongs to. Referenced from
    # AlertMetadata, Incident and IncidentPutResponse, which each carried their
    # own copy of this object.
    ResourceLabels:
      type: object
      properties:
        componentName:
          type: string
          description: The name of the component
        environmentName:
          type: string
          description: The name of the environment
        projectName:
          type: string
          description: The name of the project
        namespaceName:
          type: string
          description: The name of the namespace
        componentUid:
          type: string
          description: The UID of the component
          format: uuid
        environmentUid:
          type: string
          description: The UID of the environment
          format: uuid
        projectUid:
          type: string
          description: The UID of the project
          format: uuid

    AlertRuleSource:
      type: object
      description: The source configuration of the alert rule
      properties:
        type:
          type: string
          description: The type of the alert source
          enum:
            - log
            - metric
            - budget
        query:
          type: string
          description: The query used for log-based alerts
        metric:
          type: string
          description: The metric used for metric-based alerts

    AlertRuleCondition:
      type: object
      description: The condition configuration of the alert rule
      properties:
        operator:
          type: string
          description: The comparison operator used for evaluation
          enum:
            - gt
            - lt
            - gte
            - lte
            - eq
            - neq
        threshold:
          type: number
          description: The threshold value that triggers the alert
        window:
          type: string
          description: The time window for aggregation (e.g. "5m", "1h")
        interval:
          type: string
          description: The evaluation interval (e.g. "1m", "5m")

    AlertRule:
      type: object
      description: The alert rule that produced the alert.
      properties:
        name:
          type: string
          description: The name of the alert rule
        description:
          type: string
          description: The description of the alert rule
        severity:
          type: string
          description: The severity of the alert rule
          enum:
            - info
            - warning
            - critical
        source:
          $ref: "#/components/schemas/AlertRuleSource"
        condition:
          $ref: "#/components/schemas/AlertRuleCondition"

    AlertMetadata:
      type: object
      properties:
        alertRule:
          $ref: "#/components/schemas/AlertRule"
        labels:
          $ref: "#/components/schemas/ResourceLabels"

    Alert:
      type: object
      description: A single fired alert.
      properties:
        timestamp:
          type: string
          description: The timestamp of the alert
          format: date-time
        alertId:
          type: string
          description: The alert ID
        alertValue:
          type: string
          description: The value of the alert
        notificationChannels:
          type: array
          description: The notification channels of the alert. Empty if failed to notify.
          items:
            type: string
            description: The name of the notification channel
        incidentEnabled:
          type: boolean
          description: Whether the alert rule is configured to trigger incidents when fired
        metadata:
          $ref: "#/components/schemas/AlertMetadata"

    # Response schema for alerts query
    AlertsQueryResponse:
      type: object
      properties:
        alerts:
          type: array
          description: The list of alerts
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
          description: The total number of alerts
        tookMs:
          type: integer
          description: The time taken to query the alerts in milliseconds

    # Request schema for incidents query
    IncidentsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          description: The maximum number of items to return
          default: 100
          minimum: 1
          maximum: 1000
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          $ref: "#/components/schemas/ComponentSearchScope"
      required: [startTime, endTime, searchScope]

    # Response schema for incidents query
    # One enum shared by Incident, IncidentPutRequest and IncidentPutResponse,
    # which each declared it inline. Constants generate unprefixed (gen.Active,
    # gen.Acknowledged, gen.Resolved), as they do for every top-level enum here
    # -- ErrorResponseTitle yields gen.BadRequest the same way. x-enum-varnames
    # and x-enumNames are both ignored by oapi-codegen v2.5.1.
    IncidentStatus:
      type: string
      description: The status of the incident
      enum:
        - active
        - acknowledged
        - resolved

    Incident:
      type: object
      description: A single incident raised from a fired alert.
      properties:
        timestamp:
          type: string
          description: The timestamp of the incident
          format: date-time
        alertId:
          type: string
          description: The ID of the alert that triggered the incident
        incidentId:
          type: string
          description: The ID of the incident
        incidentTriggerAiRca:
          type: boolean
          description: Whether AI RCA was triggered for the incident
        incidentTriggerAiCostAnalysis:
          type: boolean
          description: Whether AI cost analysis was triggered for the incident
        status:
          $ref: "#/components/schemas/IncidentStatus"
        triggeredAt:
          type: string
          description: The timestamp when the incident was triggered
          format: date-time
        acknowledgedAt:
          type: string
          description: The timestamp when the incident was acknowledged
          format: date-time
        resolvedAt:
          type: string
          description: The timestamp when the incident was resolved
          format: date-time
        notes:
          type: string
          description: Notes associated with the incident
        description:
          type: string
          description: The description of the incident
        labels:
          $ref: "#/components/schemas/ResourceLabels"

    IncidentsQueryResponse:
      type: object
      properties:
        incidents:
          type: array
          description: The list of incidents
          items:
            $ref: "#/components/schemas/Incident"
        total:
          type: integer
          description: The total number of incidents
        tookMs:
          type: integer
          description: The time taken to query the incidents in milliseconds

    # Request schema for incident update (PUT)
    IncidentPutRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        notes:
          type: string
          description: Notes associated with the incident
        description:
          type: string
          description: The description of the incident
      required: [status]

    # Response schema for incident update (PUT)
    IncidentPutResponse:
      type: object
      properties:
        incidentId:
          type: string
          description: The ID of the incident
        alertId:
          type: string
          description: The ID of the alert that triggered the incident
        status:
          $ref: "#/components/schemas/IncidentStatus"
        triggeredAt:
          type: string
          description: The timestamp when the incident was triggered
          format: date-time
        acknowledgedAt:
          type: string
          description: The timestamp when the incident was acknowledged
          format: date-time
        resolvedAt:
          type: string
          description: The timestamp when the incident was resolved
          format: date-time
        notes:
          type: string
          description: Notes associated with the incident
        description:
          type: string
          description: The description of the incident
        incidentTriggerAiRca:
          type: boolean
          description: Whether AI RCA was triggered for the incident
        incidentTriggerAiCostAnalysis:
          type: boolean
          description: Whether AI cost analysis was triggered for the incident
        labels:
          $ref: "#/components/schemas/ResourceLabels"

    # FinOps cost insights schemas
    CostResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            Flat list of per-component cost records. Without `granularity`, one
            record per component. With `granularity`, one record per component
            per time bucket.
          items:
            $ref: "#/components/schemas/ComponentCost"

    ComponentCost:
      type: object
      required:
        - componentUid
        - component
        - startTime
        - endTime
        - environmentUid
        - environment
        - projectUid
        - project
        - namespace
        - cpuCost
        - memoryCost
        - efficiency
      properties:
        componentUid:
          type: string
          format: uuid
          description: UID of the component this record belongs to.
        component:
          type: string
          description: Human-readable component name.
        startTime:
          type: string
          format: date-time
          description: Inclusive start of the window this record covers.
        endTime:
          type: string
          format: date-time
          description: Exclusive end of the window this record covers.
        environmentUid:
          type: string
          format: uuid
        environment:
          type: string
          description: Human-readable environment name.
        projectUid:
          type: string
          format: uuid
        project:
          type: string
          description: Human-readable project name.
        namespace:
          type: string
          description: Namespace name.
        cpuCost:
          type: number
          format: float
          description: CPU cost for this record's window.
        memoryCost:
          type: number
          format: float
          description: Memory cost for this record's window.
        efficiency:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Cost-weighted blend of CPU and memory utilization for this record's
            window. A value of 0.85 means 85% of what was paid for was used.

    RecommendationResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            One recommendation per component in scope. A single element when
            `component` is specified; one per component in the project otherwise.
          items:
            $ref: "#/components/schemas/ComponentRecommendation"

    ComponentRecommendation:
      type: object
      required:
        - componentUid
        - component
        - environmentUid
        - environment
        - projectUid
        - project
        - namespace
        - current
        - recommendation
      properties:
        componentUid:
          type: string
          format: uuid
        component:
          type: string
          description: Human-readable component name.
        environmentUid:
          type: string
          format: uuid
        environment:
          type: string
          description: Human-readable environment name.
        projectUid:
          type: string
          format: uuid
        project:
          type: string
          description: Human-readable project name.
        namespace:
          type: string
        current:
          $ref: "#/components/schemas/ResourceProfile"
        recommendation:
          $ref: "#/components/schemas/ResourceProfile"

    ResourceProfile:
      type: object
      description: |
        Resource requests, limits, and resulting cost. Resource fields use
        Kubernetes quantity notation as strings (e.g. `"230m"` for CPU
        millicores, `"250Mi"` for memory).
      required:
        [cpuRequest, cpuLimit, memoryRequest, memoryLimit, cpuCost, memoryCost]
      properties:
        cpuRequest:
          type: string
          example: "230m"
        cpuLimit:
          type: string
          example: "530m"
        memoryRequest:
          type: string
          example: "250Mi"
        memoryLimit:
          type: string
          example: "500Mi"
        cpuCost:
          type: number
          format: float
          description: CPU cost for the selected time window at these resource settings.
        memoryCost:
          type: number
          format: float
          description: Memory cost for the selected time window at these resource settings.

    OAuthProtectedResourceMetadata:
      type: object
      description: |
        OAuth 2.0 protected resource metadata as defined in RFC 9728.
        `openchoreo_security_enabled` is an OpenChoreo extension, permitted by
        RFC 9728 §2.
      required:
        - resource_name
        - resource
        - authorization_servers
        - bearer_methods_supported
        - scopes_supported
      properties:
        resource_name:
          type: string
          description: Human-readable name of the protected resource
          example: OpenChoreo Observer MCP Server
        resource:
          type: string
          description: URL of the protected resource
          example: https://observer.openchoreo.dev/mcp
        authorization_servers:
          type: array
          description: List of authorization server URLs
          items:
            type: string
        bearer_methods_supported:
          type: array
          description: Supported bearer token methods
          items:
            type: string
          example:
            - header
        scopes_supported:
          type: array
          description: Supported OAuth scopes
          items:
            type: string
        openchoreo_security_enabled:
          type: boolean
          description: Whether authentication is enforced on this server

    # New error response schema
    ErrorResponse:
      type: object
      properties:
        title:
          type: string
          description: The error message
          enum:
            - badRequest
            - unauthorized
            - forbidden
            - notFound
            - conflict
            - internalServerError
            - notImplemented
        errorCode:
          type: string
          description: The error code from observer service
          example: OBS-V1-L-22
        message:
          type: string
          description: Human-readable error message
          example: "Missing required fields 'startTime' and 'endTime'"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication. Include the token in the Authorization header as 'Bearer <token>'.
