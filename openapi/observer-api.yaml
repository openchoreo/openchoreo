  # FinOps cost insights endpoints
  /api/v1alpha1/costs/namespaces/{namespace}/environments/{environment}:
    get:
      tags:
        - FinOps
      summary: Component cost records for a namespace+environment
      description: |
        Returns a flat list of per-component cost records for the namespace
        within the given environment. Use `project` and `component` to narrow
        the scope, and `granularity` to split each component into time buckets.
      operationId: getComponentCosts
      parameters:
        - $ref: "#/components/parameters/FinOpsNamespace"
        - $ref: "#/components/parameters/FinOpsEnvironment"
        - $ref: "#/components/parameters/FinOpsProject"
        - $ref: "#/components/parameters/FinOpsComponent"
        - $ref: "#/components/parameters/FinOpsStartTime"
        - $ref: "#/components/parameters/FinOpsEndTime"
        - $ref: "#/components/parameters/FinOpsGranularity"
      responses:
        "200":
          description: A list of component cost records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1alpha1/costs/namespaces/{namespace}/environments/{environment}/recommendations:
    get:
      tags:
        - FinOps
      summary: Right-sizing recommendations for a project or single component
      description: |
        Returns right-sizing recommendations for components in the specified
        environment. Each recommendation compares current resource requests and
        limits against recommended values derived from observed usage. The
        `project` and `component` query params filter the result the same way
        they do on the costs endpoint; `component` may only be set when
        `project` is also set.
      operationId: getRecommendations
      parameters:
        - $ref: "#/components/parameters/FinOpsNamespace"
        - $ref: "#/components/parameters/FinOpsEnvironment"
        - $ref: "#/components/parameters/FinOpsProject"
        - $ref: "#/components/parameters/FinOpsComponent"
        - $ref: "#/components/parameters/FinOpsStartTime"
        - $ref: "#/components/parameters/FinOpsEndTime"
      responses:
        "200":
          description: A list of right-sizing recommendations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Platform logs endpoint
  /api/v1alpha1/platform-logs:
    get:
      tags:
        - Logs
      summary: Query platform logs
      description: |
        Returns pod logs addressed by raw Kubernetes coordinates - cluster, namespace,
        pod, container - across everything the observability plane collects.
        `POST /api/v1/logs/query` is the ownership-checked counterpart,
        addressed by project, component and environment instead.

        Multi-value filters OR within a parameter and AND across parameters.

        `labels` selects on the pod labels each record carries - for example
        `labels=openchoreo.dev/plane%3Dcontrolplane` narrows the search for logs
        from OpenChoreo control plane components. Being a label selector, its commas
        mean AND rather than OR.
      operationId: getPlatformLogs
      parameters:
        - $ref: "#/components/parameters/PlatformLogsClusterInstance"
        - $ref: "#/components/parameters/PlatformLogsNamespace"
        - $ref: "#/components/parameters/PlatformLogsPodName"
        - $ref: "#/components/parameters/PlatformLogsContainerName"
        - $ref: "#/components/parameters/PlatformLogsLabels"
        - $ref: "#/components/parameters/PlatformLogsLogLevels"
        - $ref: "#/components/parameters/PlatformLogsSearchPhrase"
        - $ref: "#/components/parameters/PlatformLogsStartTime"
        - $ref: "#/components/parameters/PlatformLogsEndTime"
        - $ref: "#/components/parameters/PlatformLogsLimit"
        - $ref: "#/components/parameters/PlatformLogsSortOrder"
      responses:
        "200":
          description: Platform logs retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLogsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Not Implemented. Surfaced when the logs adapter backing this observer
            answers the platform logs query with a 501 of its own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "platform logs are not supported by this adapter"

  # Audit logs endpoint
  /api/v1alpha1/audit-logs/query:
    post:
      tags:
        - AuditLogs
      summary: Query audit logs
      description: |
        Returns records from the audit trail — who did what, from where, and whether it
        was allowed. Served from the audit destination, which has its own retention
        independent of the log retention behind the other endpoints.

        Requires `auditlog:view`, evaluated at cluster scope. The trail discloses
        activity across every team, so reading it is a privilege in its own right rather
        than something a broad observability grant carries.

        The tenancy fields in the body (`namespace`, `project`, `component`,
        `environment`) narrow the result set. **They do not widen authorization**: a
        namespace-scoped binding does not satisfy this query even when the body names
        only that namespace. Working in a project does not confer the right to read its
        audit trail.

        Expressed as POST rather than GET to carry the filter set in a body, matching the
        observer's other filter-body reads (`/logs/query`, `/events/query`,
        `/traces/query` and the rest). `GET /api/v1alpha1/platform-logs` is the one
        filter-query read on a GET; the remaining GETs are path-addressed reports.

        A `501` here means the configured logs adapter does not serve audit logs — see
        that response. It is never answered with an empty `200`, which would be
        indistinguishable from "nothing happened".
      operationId: queryAuditLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditLogsQueryRequest"
      responses:
        "200":
          description: Audit logs retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
        "400":
          description: |
            Invalid request. Also the response for an expired `cursor`, distinguished by
            `errorCode` — the caller must restart the query from the first page rather
            than treat it as the end of the trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "badRequest"
                errorCode: "OBS-V1-AL-06"
                message: "The audit logs cursor has expired; restart the query"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Not Implemented. Surfaced when the logs adapter backing this observer answers
            the audit logs query with a 501 of its own — the adapter does not serve the
            audit trail.

            A deployment configured forward-only, publishing the trail to an external
            SIEM and keeping no queryable copy, reaches this too: the read path is
            disabled by configuration, and this is where that is reported rather than
            being discovered as an empty result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "audit logs are not supported by this adapter"

  # Audit log filter values endpoint
  /api/v1alpha1/audit-logs/filter-values:
    post:
      tags:
        - AuditLogs
      summary: List the distinct values one audit log filter can take
      description: |
        Returns the distinct values a single filter takes across the audit trail under a
        given query, with a count for each. This is what a filter picker is populated
        from: the values reachable in the whole matching set, rather than only those
        that happen to appear in the page of records a client has loaded.

        **One filter per request, by design.** Answering every filter at once needs one
        aggregation per filter rather than one in total, which on a busy trail is enough
        load to matter on every keystroke that changes a query. Asking for the one
        filter whose picker is open keeps the cost proportional to what the client
        actually needs.

        **`query` is honoured, except for the named filter itself.** The values returned
        are those reachable under `query`'s other filters — so selecting a namespace
        narrows the actions on offer — but the named filter's own selections are
        ignored. Counting `actor.id` under a selected actor would leave that actor the
        only value on offer, with no way back to the others; excluding it keeps the
        picker a way to change the selection rather than a mirror of it.

        **Always scoped to a time window.** `query.startTime` and `query.endTime` are
        required, so this returns the values reachable in a period rather than across
        the whole trail — the same window the record query would run under, which is
        what makes a picker's values agree with the results it leads to.
        `query.searchPhrase` is honoured for the same reason.

        `query.limit`, `query.sortOrder`, `query.cursor`, `query.includeTimeline` and
        `query.timelineInterval` are ignored — no records are returned and there is
        nothing to page.

        Requires `auditlog:view`, evaluated at cluster scope — the same permission as
        the record query, because this discloses the same content. Enumerating every
        actor, resource name and source address in the trail is a disclosure of the
        trail even without the records attached, so a caller who cannot read the records
        cannot read this either. As on the record query, the tenancy filters in
        `query.resource` narrow the result and **do not widen authorization**.
      operationId: queryAuditLogFilterValues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditLogFilterValuesRequest"
      responses:
        "200":
          description: Filter values retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogFilterValuesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Not Implemented. Surfaced when the logs adapter backing this observer does
            not serve audit logs, or serves the records but not this aggregation. A
            client should treat it as "no pick list available" and fall back to
            free-text entry on that filter, not as "this filter has no values".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "audit log filter values are not supported by this adapter"

  # Runtime topology endpoint (for cell diagram with runtime observability)
  /api/v1alpha1/metrics/runtime-topology:
    post:
      tags:
        - RuntimeTopology
      summary: Query runtime topology
      description: |
        Returns the live HTTP traffic topology for a project in a given environment:
        a list of nodes (components, gateways, external endpoints) and a list of edges
        (observed source -> target traffic flows), each with aggregated metrics
        (request count, error count, latency percentiles) computed over the requested
        time window.
      operationId: queryRuntimeTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeTopologyRequest"
      responses:
        "200":
          description: Runtime topology queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeTopologyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
