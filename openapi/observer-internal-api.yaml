openapi: 3.0.3
info:
  title: OpenChoreo Observer Internal API
  description: |
    The OpenChoreo Observer Internal API is served on the observer's internal
    port (INTERNAL_PORT, default 8081) and exposed only as a cluster-local
    ClusterIP Service (observer-internal). It is NOT routed through the
    gateway and is NOT reachable from outside the cluster.

    Callers are in-cluster components, not end users:
      - the observability plane's ObservabilityAlertRule controller (alert rule CRUD)
      - an observability module's logs-adapter or metrics-adapter (alert webhook)

    Authentication: this API declares no security scheme, because none is
    enforced. Network reachability is the control. This accurately describes
    the deployed topology rather than an aspiration -- see the note below.

    **One external dependency.** This spec owns its own domain schemas. The
    single exception is `ErrorResponse`, which is genuinely shared with the
    public API and is `$ref`'d from `observer-api.yaml` so the Go model stays
    single-sourced. That one reference means the file cannot be loaded entirely
    on its own: any tool that reads it standalone -- a docs publish, a
    spectral/redocly lint, third-party SDK generation -- must resolve
    `./observer-api.yaml` from the same directory. Keep both files together in
    `openapi/`, and bundle them (e.g. `redocly bundle`) before handing this
    spec to anything that cannot follow relative file refs.
  version: 1.0.0
  contact:
    name: OpenChoreo Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: Alerts
    description: Internal alert rule CRUD and alert webhook endpoints

# NOTE: There is deliberately no global `security:` block here, and no
# `security: []` on individual operations.
#
# The observer's internal port has no JWT layer, and the ObservabilityAlertRule
# controller that drives alert rule CRUD sends no Authorization header (it has
# no token source: the reconciler acts for no user). Declaring BearerAuth here
# would make the generated router demand a token that no caller sends, breaking
# alert rule reconciliation.
#
# Do NOT add a security scheme to this spec on its own. Requiring auth on these
# operations is a deliberate, separate change that must land together with a
# service-account token source in internal/controller/observabilityalertrule.

paths:
  /api/v1alpha1/alerts/sources/{sourceType}/rules:
    parameters:
      - name: sourceType
        in: path
        required: true
        description: The source type of the alert rule (log, metric, or budget)
        schema:
          type: string
          enum:
            - log
            - metric
            - budget
    post:
      tags:
        - Alerts
      summary: Create alert rule
      description: Create an alert rule in the observer service
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "201":
          description: Alert rule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "409":
          description: Alert rule already exists
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"

  /api/v1alpha1/alerts/sources/{sourceType}/rules/{ruleName}:
    parameters:
      - name: sourceType
        in: path
        required: true
        description: The source type of the alert rule (log, metric, or budget)
        schema:
          type: string
          enum:
            - log
            - metric
            - budget
      - name: ruleName
        in: path
        required: true
        description: The name of the alert rule
        schema:
          type: string
    get:
      tags:
        - Alerts
      summary: Get alert rule
      description: Get an alert rule in the observer service
      operationId: getAlertRule
      responses:
        "200":
          description: Alert rule retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
    put:
      tags:
        - Alerts
      summary: Update alert rule
      description: Update an alert rule in the observer service
      operationId: updateAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "200":
          description: Alert rule updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        # The handler has always returned 404 on ErrAlertRuleNotFound; the
        # pre-split spec simply never declared it. Documented here rather than
        # dropped, so the generated strict interface can express the behavior
        # the service actually has.
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alerts
      summary: Delete alert rule
      description: Delete an alert rule in the observer service
      operationId: deleteAlertRule
      responses:
        "200":
          description: Alert rule deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"

  # NOTE (webhook): this endpoint is called by an observability module's logs-adapter or
  # metrics-adapter.
  /api/v1alpha1/alerts/webhook:
    post:
      tags:
        - Alerts
      summary: Handles triggered alerts from the alerting backend
      description: Handles triggered alerts from the alerting backend
      operationId: handleAlertWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertWebhookRequest"
      responses:
        "200":
          description: Alert webhook handled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertWebhookResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./observer-api.yaml#/components/schemas/ErrorResponse"

components:
  schemas:
    # Request schemas for alert rules
    AlertRuleRequest:
      type: object
      required: [metadata, source, condition]
      properties:
        metadata:
          type: object
          required: [name, namespace, projectUid, environmentUid, componentUid]
          properties:
            name:
              type: string
              description: The name of the alert rule
            namespace:
              type: string
              description: The namespace of the alert rule CR
            projectUid:
              type: string
              description: The OpenChoreo project UID to query
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID to query
              format: uuid
            componentUid:
              type: string
              description: The OpenChoreo component UID to query
              format: uuid
        source:
          type: object
          required: [type]
          properties:
            type:
              type: string
              description: The type of the source
              enum:
                - log
                - metric
                - budget
            query:
              type: string
              description: The query to execute for log based alerts
            metric:
              type: string
              description: The metric to query for metric based alerts
              enum:
                - cpu_usage
                - memory_usage
                - budget
        condition:
          type: object
          required: [enabled, window, interval, operator, threshold]
          properties:
            enabled:
              type: boolean
              description: Whether the alert rule is enabled
            window:
              type: string
              description: The window of time to query for the alert rule
            interval:
              type: string
              description: The interval of time to query for the alert rule
            operator:
              type: string
              description: The operator to use for the alert rule
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
              description: The threshold value to use for the alert rule

    # Response schemas for alert rules
    AlertRuleResponse:
      type: object
      properties:
        metadata:
          type: object
          properties:
            name:
              type: string
              description: The name of the alert rule
            namespace:
              type: string
              description: The namespace of the alert rule CR
            projectUid:
              type: string
              description: The OpenChoreo project UID to query
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID to query
              format: uuid
            componentUid:
              type: string
              description: The OpenChoreo component UID to query
              format: uuid
        source:
          type: object
          properties:
            type:
              type: string
              description: The type of the source
              enum:
                - log
                - metric
                - budget
            query:
              type: string
              description: The query to execute for log based alerts
            metric:
              type: string
              description: The metric to query for metric based alerts
              enum:
                - cpu_usage
                - memory_usage
                - budget
        condition:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the alert rule is enabled
            window:
              type: string
              description: The window of time to query for the alert rule
            interval:
              type: string
              description: The interval of time to query for the alert rule
            operator:
              type: string
              description: The operator to use for the alert rule
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
              description: The threshold value to use for the alert rule

    AlertingRuleSyncResponse:
      type: object
      properties:
        action:
          type: string
          description: The action taken on the alert rule
          enum:
            - created
            - updated
            - unchanged
            - deleted
        lastSyncedAt:
          type: string
          description: The timestamp of the last sync
        status:
          type: string
          description: The status of the alert rule
          enum:
            - synced
            - failed
        ruleLogicalId:
          type: string
          description: The logical ID (name) of the alert rule
        ruleBackendId:
          type: string
          description: The backend ID (UID from observability backend) of the alert rule

    # Request schema for alert webhook
    AlertWebhookRequest:
      type: object
      properties:
        ruleName:
          type: string
          description: The name of the alert rule
        ruleNamespace:
          type: string
          description: The namespace of the alert rule
        alertValue:
          type: number
          description: The value of the alert
        alertTimestamp:
          type: string
          description: The timestamp of the alert
          format: date-time

    # Response schema for alert webhook
    AlertWebhookResponse:
      type: object
      properties:
        message:
          type: string
          description: The message of the alert webhook
        status:
          type: string
          description: The status of the alert webhook
          enum:
            - success
            - error
