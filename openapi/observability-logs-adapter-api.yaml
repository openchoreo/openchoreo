openapi: 3.0.3
info:
  title: OpenChoreo Observability Logs Adapter API
  description: |
    This API specification defines the contract that a logging adapter must implement
    to integrate with the OpenChoreo Observer. The Observer calls these endpoints to
    query logs and manage alert rules from the logging backend provided by the module.
  version: 1.0.0
  contact:
    name: OpenChoreo Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: Logs
    description: Log retrieval endpoints
  - name: Alerts
    description: Alert rule management endpoints
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the observer service.
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  error:
                    type: string
                    example: "opensearch: connection failed"

  # Logs query endpoint
  /api/v1/logs/query:
    post:
      tags:
        - Logs
      summary: Query logs
      description: Query logs from the observer service
      operationId: queryLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsQueryRequest"
      responses:
        "200":
          description: Logs queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsQueryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "badRequest"
                errorCode: ""
                message: "Missing required fields 'startTime' and 'endTime'"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "unauthorized"
                errorCode: ""
                message: "Invalid or missing token"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "forbidden"
                errorCode: ""
                message: "Subject <xyz> has no permission to view logs of Namespace foo, Project bar, Component baz in Environment development"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "internalServerError"
                errorCode: "OBS-V1-L-29"
                message: ""

  /api/v1alpha1/platform-logs/query:
    post:
      tags:
        - Logs
      summary: Query platform logs
      description: |
        Query logs by raw Kubernetes coordinates, with no project/component/environment
        correlation. Backs `GET /api/v1alpha1/platform-logs` on the observer.

      operationId: queryPlatformLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLogsQueryRequest"
      responses:
        "200":
          description: Platform logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLogsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "platform logs are not supported by this adapter"

  /api/v1alpha1/audit-logs/query:
    post:
      tags:
        - AuditLogs
      summary: Query audit logs
      description: |
        Query the audit trail — the record of who did what, from where, and whether it
        was allowed. Backs `POST /api/v1alpha1/audit-logs/query` on the observer.

        This is a separate signal from logs, not a filter over them: audit records are
        published to their own destination with its own retention, and an adapter may
        serve them from a different index, cluster or credential than it serves pod logs
        from.

        **An adapter that does not implement this must answer `501`, never an empty
        `200`.** An empty success is indistinguishable from "nothing happened", which is
        the one answer an audit query must never fabricate. A deployment configured
        forward-only — publishing the trail to an external SIEM and keeping no queryable
        copy — is an explicitly read-path-disabled configuration and answers `501` too.

        Ordering is stable across pages via `cursor`, an opaque token this adapter mints
        and interprets. See the `410` response for what happens when one expires.
      operationId: queryAuditLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditLogsQueryRequest"
      responses:
        "200":
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: |
            Gone. The `cursor` is no longer valid — the point-in-time it pins has
            expired, or the indices it was minted against have been rolled or deleted.
            The caller must restart the query from the first page.

            A distinct status rather than a `400`: the observer maps this by status code,
            exactly as it maps `501`, and a generic `400` would be indistinguishable from
            a malformed request body. Answering `200` with an empty page instead is the
            one thing an adapter must not do — it reads as the end of the trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "gone"
                errorCode: ""
                message: "audit logs cursor has expired; restart the query"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Not Implemented. The adapter does not serve audit logs. Answer this rather
            than an empty `200` — see the operation description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "audit logs are not supported by this adapter"

  /api/v1alpha1/audit-logs/filter-values:
    post:
      tags:
        - AuditLogs
      summary: List the distinct values one audit log filter can take
      description: |
        Returns the distinct values a single filter takes under a given query, with a
        count for each. Backs `POST /api/v1alpha1/audit-logs/filter-values` on the
        observer, which populates filter pickers from it.

        **One filter per request, by design.** Answering every filter at once costs one
        aggregation per filter rather than one in total; the observer asks for the one
        whose picker is open so the cost stays proportional to what its caller needs.

        **Apply `query`'s other filters, but not the named filter's own.** Values are
        those reachable under the rest of the query; the named filter's selections are
        ignored, so a picker keeps offering the alternatives to what is already
        selected rather than only the selection itself.

        **Always scoped to a time window.** `query.startTime` and `query.endTime` are
        required, so the values returned are those reachable in that period rather
        than across the whole trail. Honour them, and `query.searchPhrase`, exactly as
        a record query would.

        `query.limit`, `query.sortOrder`, `query.cursor`, `query.includeTimeline` and
        `query.timelineInterval` carry no meaning here and must be ignored.

        An adapter that serves audit records but cannot aggregate answers `501` here
        while continuing to serve `/audit-logs/query` — the two are separately
        declinable on purpose, so a module can ship the records first.
      operationId: queryAuditLogFilterValues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditLogFilterValuesRequest"
      responses:
        "200":
          description: Filter values retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogFilterValuesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Not Implemented. The adapter does not serve audit logs, or serves the
            records but not this aggregation. Answer this rather than an empty `200`:
            an empty value list reads as "this filter has no values", which is a
            different and wrong answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "audit log filter values are not supported by this adapter"

  /api/v1/events/query:
    post:
      tags:
        - Events
      summary: Query events
      description: Query Kubernetes events from the observer service
      operationId: queryEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsQueryRequest"
      responses:
        "200":
          description: Events queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsQueryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "badRequest"
                errorCode: ""
                message: "Missing required fields 'startTime' and 'endTime'"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "unauthorized"
                errorCode: ""
                message: "Invalid or missing token"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "forbidden"
                errorCode: ""
                message: "Subject <xyz> has no permission to view events of Namespace foo, Project bar, Component baz in Environment development"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "internalServerError"
                errorCode: "OBS-V1-E-01"
                message: ""
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: "notImplemented"
                errorCode: ""
                message: "Events query is not implemented by this adapter"

  /api/v1alpha1/alerts/rules:
    post:
      tags:
        - Alerts
      summary: Create alert rule
      description: Create an alert rule in the observer service
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "201":
          description: Alert rule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Alert rule already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1alpha1/alerts/webhook:
    post:
      tags:
        - Alerts
      summary: Handles triggered alerts from the alerting backend
      description: Handles triggered alerts from the alerting backend
      operationId: handleAlertWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The request body can be any JSON object, as different alerting backends may send different payloads.
      responses:
        "200":
          description: Alert webhook handled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertWebhookResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1alpha1/alerts/rules/{ruleName}:
    parameters:
      - name: ruleName
        in: path
        required: true
        description: The name of the alert rule
        schema:
          type: string
    get:
      tags:
        - Alerts
      summary: Get alert rule
      description: Get an alert rule from the logging backend
      operationId: getAlertRule
      responses:
        "200":
          description: Alert rule retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Alerts
      summary: Update alert rule
      description: Update an alert rule in the logging backend
      operationId: updateAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "200":
          description: Alert rule updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alerts
      summary: Delete alert rule
      description: Delete an alert rule in the observer service
      operationId: deleteAlertRule
      responses:
        "200":
          description: Alert rule deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertingRuleSyncResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # Request schemas for logs
    ComponentSearchScope:
      type: object
      properties:
        namespace:
          type: string
        projectUid:
          type: string
        componentUid:
          type: string
        environmentUid:
          type: string
      required: [namespace]

    WorkflowSearchScope:
      type: object
      properties:
        namespace:
          type: string
        workflowRunName:
          type: string
        taskName:
          type: string
          description: Filter events to a specific workflow task
      required: [namespace]

    LogsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          oneOf:
            - $ref: "#/components/schemas/ComponentSearchScope"
            - $ref: "#/components/schemas/WorkflowSearchScope"
        logLevels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        searchPhrase:
          type: string
      required: [startTime, endTime, searchScope]

    # Response schemas for logs
    ComponentLogEntry:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the log entry
          format: date-time
        log:
          type: string
          description: The log message
        level:
          type: string
          description: The log level
        metadata:
          type: object
          description: The metadata of the log entry
          properties:
            componentName:
              type: string
              description: The OpenChoreo component name that generated the log
            projectName:
              type: string
              description: The OpenChoreo project name that generated the log
            environmentName:
              type: string
              description: The OpenChoreo environment name that generated the log
            namespaceName:
              type: string
              description: The OpenChoreo namespace name that generated the log
            componentUid:
              type: string
              description: The OpenChoreo component UID that generated the log
              format: uuid
            projectUid:
              type: string
              description: The OpenChoreo project UID that generated the log
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID that generated the log
              format: uuid
            containerName:
              type: string
              description: The container name that generated the log
            podName:
              type: string
              description: The Kubernetes pod name that generated the log
            podNamespace:
              type: string
              description: The namespace of the Kubernetes pod that generated the log

    WorkflowLogEntry:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the log entry
          format: date-time
        log:
          type: string
          description: The log message

    LogsQueryResponse:
      type: object
      properties:
        logs:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ComponentLogEntry"
            - type: array
              items:
                $ref: "#/components/schemas/WorkflowLogEntry"
          description: The logs queried successfully
        total:
          type: integer
          description: The total number of matching log entries, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the logs in milliseconds

    # Cluster log schemas
    PlatformLogsQueryRequest:
      type: object
      description: |
        A flat set of Kubernetes coordinates. Multi-value fields OR within a field; fields
        AND with each other. An absent field is not a filter.
      properties:
        startTime:
          type: string
          description: Inclusive lower bound of the log window
          format: date-time
        endTime:
          type: string
          description: Exclusive upper bound of the log window
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of entries to return
        sortOrder:
          type: string
          description: Sort direction on the log timestamp
          enum:
            - asc
            - desc
          default: desc
        clusterInstance:
          type: array
          uniqueItems: true
          description: Clusters the records were collected from, as stamped by the collector
          items:
            type: string
        namespace:
          type: array
          uniqueItems: true
          description: Kubernetes namespaces of the pods
          items:
            type: string
        podName:
          type: array
          uniqueItems: true
          items:
            type: string
        containerName:
          type: array
          uniqueItems: true
          items:
            type: string
        labels:
          type: object
          description: |
            Pod labels every returned record must carry, ANDed. The observer parses the
            equality-based selector it receives and passes the resulting pairs, so the
            adapter does not implement selector syntax. Plane attribution arrives here.
          additionalProperties:
            type: string
        logLevels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        searchPhrase:
          type: string
      required: [startTime, endTime]

    PlatformLog:
      type: object
      required:
        - timestamp
        - log
      properties:
        timestamp:
          type: string
          description: The timestamp of the log entry
          format: date-time
        log:
          type: string
          description: The log message
        level:
          type: string
          description: |
            Log severity. Derived from the message text where the backend does not supply
            one; omitted when it cannot be determined.
        clusterInstance:
          type: string
        namespaceName:
          type: string
        podName:
          type: string
        containerName:
          type: string
        podIp:
          type: string
        nodeName:
          type: string
          description: Node the pod was scheduled on.
        containerImage:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Pod labels carried on the record, as the backend stores them, with any
            backend-specific key mangling already undone by the adapter.

    PlatformLogsResponse:
      type: object
      properties:
        logs:
          type: array
          description: The logs queried successfully
          items:
            $ref: "#/components/schemas/PlatformLog"
        total:
          type: integer
          description: The total number of matching log entries, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the logs in milliseconds
      required: [logs, total, tookMs]

    # Request schema for audit logs
    AuditLogsQueryRequest:
      type: object
      description: |
        A filter set over the audit trail, shaped like the record it filters. Every
        filter is named and nested exactly as the field it matches in `AuditLogRecord`,
        so an adapter maps a filter onto a stored field without a lookup table.

        Record-derived filters keep the record's snake_case spelling (`operation_id`,
        `source_ip`); the query's own controls stay camelCase (`startTime`, `limit`,
        `includeTimeline`). The casing marks which of the two a field is.

        Multi-value fields OR within a field; fields AND with each other. An absent
        field is not a filter.

        The tenancy filters under `resource` filter the record's own `resource` group.
        They are filters, not scopes — the observer authorizes the query at cluster
        scope before it reaches this adapter, so an adapter must not treat them as a
        permission.

        `resource.uid` and `resource.resource` have no filter; see the observer spec
        for why.
      properties:
        startTime:
          type: string
          description: Inclusive lower bound of the event window
          format: date-time
        endTime:
          type: string
          description: Exclusive upper bound of the event window
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of records to return
        sortOrder:
          type: string
          description: Sort direction on the event time
          enum:
            - asc
            - desc
          default: desc
        cursor:
          type: string
          maxLength: 4096
          description: |
            Opaque continuation token from a previous response's `nextCursor`. Minted
            and interpreted by this adapter; the observer passes it through without
            parsing it. Its shape is deliberately unspecified so the contract does not
            pick a storage backend by accident.

            When `cursor` is set, the adapter must continue the ordering the token
            pins rather than re-running the query, so a record written mid-scroll
            cannot shift a page boundary. An expired token is a `410`.
        includeTimeline:
          type: boolean
          default: false
          description: |
            Also return per-interval counts across the queried window, broken down by
            `result`. Costs one aggregation pass on top of the search, which is why it
            is opt-in; the observer requests it only for a first page.

            An adapter that cannot compute it answers normally and omits `timeline`
            rather than failing the query.

            This is the only aggregation on this operation. Per-filter distinct values
            are deliberately not requested here — one aggregation per filter rather
            than one in total is enough load to matter on a busy trail, and they are
            planned as their own operation instead.
        timelineInterval:
          type: string
          pattern: "^[1-9][0-9]*[mhdw]$"
          description: |
            Requested bucket width for `timeline`, in `<count><unit>` notation where
            unit is one of `m`, `h`, `d` or `w`. Ignored unless `includeTimeline` is
            true; when omitted the adapter chooses a width from the window.

            A width that would produce more than 500 buckets must be **coarsened, not
            rejected**, and the width actually used reported in `timeline.interval`.
          example: 15m
        actor:
          $ref: "#/components/schemas/AuditLogsActorFilter"
        resource:
          $ref: "#/components/schemas/AuditLogsResourceFilter"
        action:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Semantic action names, e.g. `create_project`
          items:
            type: string
            maxLength: 253
        category:
          type: array
          uniqueItems: true
          maxItems: 2
          description: |
            Event categories. A closed set: the observer rejects an unknown value with
            a `400` rather than forwarding a filter that would silently match nothing.
          items:
            type: string
            enum: ["management", "authorization"]
        result:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Outcomes. Closed, for the same reason as `category`.
          items:
            type: string
            enum: ["success", "failure", "denied", "unauthenticated"]
        producer:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Emitting services, e.g. `openchoreo-api`
          items:
            type: string
            maxLength: 253
        surface:
          type: array
          uniqueItems: true
          maxItems: 2
          description: |
            Surfaces of the API the call arrived through. Closed. MCP wraps the same
            API, so the REST value is `rest` rather than `api`.
          items:
            type: string
            enum: ["rest", "mcp"]
        operation_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Canonical operation identifiers, e.g. `CreateProject`
          items:
            type: string
            maxLength: 253
        request_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Correlation IDs shared with the access log, matched exactly
          items:
            type: string
            maxLength: 253
        event_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Record identifiers, matched exactly
          items:
            type: string
            maxLength: 253
        source_ip:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Client addresses, matched exactly rather than by network range
          items:
            type: string
            maxLength: 253
        user_agent:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Client identifications, matched exactly
          items:
            type: string
            maxLength: 512
        searchPhrase:
          type: string
          maxLength: 256
          description: Free text to match within the record
      required: [startTime, endTime]

    AuditLogFilterValuesRequest:
      type: object
      description: |
        Which filter to list values for, and the query to list them under.

        **The time window lives in `query`, and it is required** — `startTime` and
        `endTime` are mandatory on `AuditLogsQueryRequest`, so every call is scoped to
        a period and there is no way to ask for distinct values across all of
        retention.

        The other filters in `query` narrow which records the values are drawn from,
        except the one named by `filter`, whose own selections are ignored.
      required: [query, filter]
      properties:
        query:
          $ref: "#/components/schemas/AuditLogsQueryRequest"
        filter:
          type: string
          description: |
            The filter to list values for, named by its path in
            `AuditLogsQueryRequest`.

            `event_id` and `request_id` are absent: near-unique per record, so a list
            of them is not something a caller picks from. `actor.session_id` is present
            because `valueSearch` makes it reachable.
          enum:
            - actor.id
            - actor.type
            - actor.issuer
            - actor.session_id
            - actor.entitlements
            - resource.type
            - resource.namespace
            - resource.environment
            - resource.project
            - resource.component
            - resource.name
            - action
            - category
            - result
            - producer
            - surface
            - operation_id
            - source_ip
            - user_agent
        valueSearch:
          type: string
          maxLength: 256
          description: |
            Return only values containing this text, case-insensitively. Narrows the
            **values** returned, unlike `query.searchPhrase`, which narrows the records
            considered.
        maxValues:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: |
            Maximum values to return, ordered by `count` descending then `value`
            ascending, so a truncated list holds the busiest. Named to stay distinct
            from `query.limit`, which is a record page size and is ignored here.

    AuditLogFilterValuesResponse:
      type: object
      required: [filter, values, totalValues, totalRelation, tookMs]
      properties:
        filter:
          type: string
          description: The filter these values belong to, echoed from the request
        values:
          type: array
          description: |
            Distinct values, ordered by `count` descending then `value` ascending.
            Records on which the field is absent are not represented: no empty-string
            entry, because no filter value would select one.
          items:
            $ref: "#/components/schemas/AuditLogFilterValue"
        totalValues:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many distinct values match, of which at most `maxValues` were returned.
            Read with `totalRelation`.
        totalRelation:
          type: string
          enum: [eq, gte]
          description: |
            Whether `totalValues` is exact (`eq`) or a lower bound (`gte`). Counting
            distinct values exactly is itself expensive on a high-cardinality field, so
            an estimate must be labelled `gte` rather than passed off as exact.
        tookMs:
          type: integer
          format: int64
          minimum: 0
          description: The time taken to compute the values in milliseconds

    AuditLogFilterValue:
      type: object
      description: One value a filter takes, with how many records carry it.
      required: [value, count]
      properties:
        value:
          type: string
          description: The value, exactly as it would be sent back as a filter
        count:
          type: integer
          format: int64
          minimum: 1
          description: |
            Matching records carrying this value. May be approximate on a
            high-cardinality filter answered from a partial term count, so it is an
            ordering hint and a sense of scale rather than a total.

    AuditLogsActorFilter:
      type: object
      description: Filters on the record's `actor` group, named and nested as the record is.
      properties:
        id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Subject identifiers. Unique only within `issuer`, so on a multi-issuer
            deployment an `id` filter is meaningful only paired with one.
          items:
            type: string
            maxLength: 253
        type:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Kinds of subject, e.g. `user`, `service_account`, `anonymous`
          items:
            type: string
            maxLength: 64
        issuer:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Token issuers — the namespace an `id` is unique within
          items:
            type: string
            maxLength: 512
        session_id:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Identity-provider session identifiers, from the token's `sid` claim. Absent
            on client-credentials tokens, so a session filter excludes service accounts.
          items:
            type: string
            maxLength: 253
        entitlements:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Entitlement values, matched against the values of **every** claim in the
            record's `actor.entitlements` map rather than one named claim — the claim
            key varies by subject kind (`groups` for a user, `sub` for a service
            account) and a caller should not have to know which.
          items:
            type: string
            maxLength: 253

    AuditLogsResourceFilter:
      type: object
      description: |
        Filters on the record's `resource` group, named and nested as the record is.
        Filters, not scopes — see `AuditLogsQueryRequest`.
      properties:
        type:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Resource kinds
          items:
            type: string
            maxLength: 253
        namespace:
          type: array
          uniqueItems: true
          maxItems: 20
          description: OpenChoreo namespaces
          items:
            type: string
            maxLength: 253
        environment:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Environments in the dual-scoped `{namespace}/{name}` form, because that is
            how the value is stored — recorded exactly as authorization evaluated it.
            A bare name will not match.
          items:
            type: string
            maxLength: 507
        project:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            maxLength: 253
        component:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            maxLength: 253
        name:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Resource names, as the handler recorded them
          items:
            type: string
            maxLength: 253

    AuditLogRecord:
      type: object
      description: |
        One audit event, in the field names and nesting it was published with. Keys are
        snake_case here while the surrounding envelope is camelCase, and that is
        deliberate: this is the frozen, versioned record a SIEM already consumes, so a
        response body can be compared against an exported log line key for key rather
        than through a translation table.

        `category` and `result` are plain strings rather than enums, unlike their
        request-side counterparts: a filter is a closed input the server validates,
        while a record's vocabulary grows with `schema_version`, and a closed enum here
        would make an older client reject a newer record.
      required:
        - schema_version
        - event_id
        - event_time
        - actor
        - action
        - category
        - result
      properties:
        schema_version:
          type: string
          description: Schema of this record. `major.minor`; major on a field removal or a
            changed value representation, minor on an addition.
          example: "1.0"
        event_id:
          type: string
          description: UUID v7, unique per record
        event_time:
          type: string
          format: date-time
          description: When the audited request was received
        actor:
          $ref: "#/components/schemas/AuditLogActor"
        action:
          type: string
          description: Semantic action name, e.g. `create_project`
        category:
          type: string
          description: Event category. `management` or `authorization` at schema 1.0.
        result:
          type: string
          description: |
            Outcome. `success`, `failure`, `denied` (an authenticated subject refused by
            policy) or `unauthenticated` (no subject at all) at schema 1.0.
        request_id:
          type: string
          description: Correlates this record with the access log line for the same request
        source_ip:
          type: string
        user_agent:
          type: string
          description: |
            Client-supplied and unverifiable, like `source_ip`. The only field that
            separates a portal session from occ, CI or an agent.
        producer:
          type: string
          description: Emitting service, e.g. `openchoreo-api`
        surface:
          type: string
          description: |
            Which surface of the API the call arrived through. `rest` or `mcp` at
            schema 1.0 — MCP wraps the same API, so the REST value is not `api`.
        operation_id:
          type: string
          description: Canonical operation identifier, e.g. `CreateProject`
        http:
          $ref: "#/components/schemas/AuditLogHTTPInfo"
        resource:
          $ref: "#/components/schemas/AuditLogResource"
        metadata:
          type: object
          additionalProperties: true
        collector:
          $ref: "#/components/schemas/AuditLogCollectorInfo"
        log:
          type: string
          description: |
            The raw line the collector ingested, preserved alongside the parsed fields.
            Present when the storage backend retains it. This is the ground truth a
            parsing discrepancy is settled against.

    AuditLogActor:
      type: object
      description: |
        Who performed the action. `id` is unique only within `issuer` — the same `sub`
        from two identity providers is two different subjects.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: e.g. `user`, `service_account`, `anonymous`
        id:
          type: string
          description: The token's validated `sub` claim, or `anonymous`
        issuer:
          type: string
          description: The token's `iss` claim; the namespace `id` is unique within
        session_id:
          type: string
          description: The token's `sid` claim, joining this event to an identity-provider login
        entitlements:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AuditLogHTTPInfo:
      type: object
      description: |
        The request line, for an event that arrived over HTTP. Absent for an MCP
        `tools/call`, which has none.
      properties:
        method:
          type: string
        path:
          type: string
          description: Route path only; query strings are not recorded

    AuditLogResource:
      type: object
      description: |
        The target resource, and the point in OpenChoreo's tree the decision was
        authorized at. Absent on a rejection that resolved no operation.
      properties:
        type:
          type: string
        namespace:
          type: string
        environment:
          type: string
          description: Dual-scoped `{namespace}/{name}`, as authorization evaluated it
        project:
          type: string
        component:
          type: string
        resource:
          type: string
        uid:
          type: string
          description: |
            Server-generated identifier that is never reused. Absent when the operation
            returned no object — a delete, or a non-CRUD mutation.
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true

    AuditLogCollectorInfo:
      type: object
      description: |
        Where the record was collected from, as stamped by the collector rather than by
        the emitting service. Cross-checks `producer`: a mismatch between the two means
        a record's claimed origin and its actual one disagree.
      properties:
        namespaceName:
          type: string
        podName:
          type: string
        containerName:
          type: string

    AuditLogsResponse:
      type: object
      properties:
        records:
          type: array
          description: Audit records matching the query, in `sortOrder` of `event_time`
          items:
            $ref: "#/components/schemas/AuditLogRecord"
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of matching records. Read with `totalRelation`.
        totalRelation:
          type: string
          enum: [eq, gte]
          description: |
            Whether `total` is exact (`eq`) or a lower bound the backend stopped counting
            at (`gte`). Required so a capped count cannot silently claim to be exact —
            an audit consumer reading `total` as exact when it is capped draws the wrong
            conclusion about how much happened.
        tookMs:
          type: integer
          format: int64
          minimum: 0
          description: The time taken to query the audit logs in milliseconds
        nextCursor:
          type: string
          maxLength: 4096
          description: |
            Opaque token for the next page. Absent when this page is the last one.
            Absence is the only end-of-results signal — see the `410` response for the
            expired case.
        timeline:
          $ref: "#/components/schemas/AuditLogTimeline"
      required: [records, total, totalRelation, tookMs]

    AuditLogTimeline:
      type: object
      description: |
        Per-interval counts across the queried window, broken down by `result`. Returned
        only when the request set `includeTimeline`, and omitted rather than empty when
        this adapter cannot compute it.
      required: [interval, buckets]
      properties:
        interval:
          type: string
          pattern: "^[1-9][0-9]*[mhdw]$"
          description: |
            The bucket width actually used, which is not necessarily the requested
            `timelineInterval` — a width exceeding 500 buckets is coarsened.
        buckets:
          type: array
          description: |
            One entry per interval, in ascending `startTime` order regardless of the
            query's `sortOrder`.

            **Buckets with no records are present with zero counts, not omitted.** The
            array covers the window from `startTime` to `endTime` contiguously; a
            sparse array would let a caller draw a continuous chart across a gap in
            activity. The final bucket may be shorter than `interval` where the window
            does not divide evenly.
          items:
            $ref: "#/components/schemas/AuditLogTimelineBucket"

    AuditLogTimelineBucket:
      type: object
      description: One interval of the timeline.
      required: [startTime, total]
      properties:
        startTime:
          type: string
          format: date-time
          description: Inclusive lower bound of the bucket; its width is `interval`
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Records in this bucket. Equals the sum of `counts`, carried separately so a
            bucket whose breakdown could not be produced still reports a height.
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          description: |
            Records in this bucket by `result`, keyed by the value itself. An open map
            so a `result` value added in a later schema needs no spec bump.

            **A result with no records in this bucket may be omitted, and an absent key
            means zero.**

    # Request schema for events
    EventsQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          oneOf:
            - $ref: "#/components/schemas/ComponentSearchScope"
            - $ref: "#/components/schemas/WorkflowSearchScope"
      required: [startTime, endTime, searchScope]

    # Response schemas for events
    EventEntry:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the event
          format: date-time
        message:
          type: string
          description: The event message
        type:
          type: string
          description: The event type (e.g. Normal, Warning)
        reason:
          type: string
          description: The short, machine-readable reason for the event (e.g. SawCompletedJob)
        metadata:
          type: object
          description: The metadata of the event
          properties:
            componentName:
              type: string
              description: The OpenChoreo component name the event is associated with
            projectName:
              type: string
              description: The OpenChoreo project name the event is associated with
            environmentName:
              type: string
              description: The OpenChoreo environment name the event is associated with
            namespaceName:
              type: string
              description: The OpenChoreo namespace name the event is associated with
            componentUid:
              type: string
              description: The OpenChoreo component UID the event is associated with
              format: uuid
            projectUid:
              type: string
              description: The OpenChoreo project UID the event is associated with
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID the event is associated with
              format: uuid
            objectKind:
              type: string
              description: The kind of the Kubernetes object the event involves (e.g. CronJob)
            objectName:
              type: string
              description: The name of the Kubernetes object the event involves
            objectNamespace:
              type: string
              description: The namespace of the Kubernetes object the event involves

    EventsQueryResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventEntry"
          description: The events queried successfully
        total:
          type: integer
          description: The total number of matching events, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the events in milliseconds

    # Request schemas for alert rules
    AlertRuleRequest:
      type: object
      required: [metadata, source, condition]
      properties:
        metadata:
          type: object
          required: [name, namespace, projectUid, environmentUid, componentUid]
          properties:
            name:
              type: string
              description: The name of the alert rule
            namespace:
              type: string
              description: The namespace of the alert rule CR
            projectUid:
              type: string
              description: The OpenChoreo project UID to query
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID to query
              format: uuid
            componentUid:
              type: string
              description: The OpenChoreo component UID to query
              format: uuid
        source:
          type: object
          required: [query]
          properties:
            query:
              type: string
              description: The query to execute for log based alerts
        condition:
          type: object
          required: [enabled, window, interval, operator, threshold]
          properties:
            enabled:
              type: boolean
              description: Whether the alert rule is enabled
            window:
              type: string
              description: The window of time to query for the alert rule
            interval:
              type: string
              description: The interval of time to query for the alert rule
            operator:
              type: string
              description: The operator to use for the alert rule
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
              description: The threshold value to use for the alert rule

    # Response schemas for alert rules
    AlertRuleResponse:
      type: object
      properties:
        metadata:
          type: object
          properties:
            name:
              type: string
              description: The name of the alert rule
            namespace:
              type: string
              description: The namespace of the alert rule CR
            projectUid:
              type: string
              description: The OpenChoreo project UID to query
              format: uuid
            environmentUid:
              type: string
              description: The OpenChoreo environment UID to query
              format: uuid
            componentUid:
              type: string
              description: The OpenChoreo component UID to query
              format: uuid
        source:
          type: object
          properties:
            query:
              type: string
              description: The query to execute for log based alerts
            metric:
              type: string
              description: The metric to query for metric based alerts
              enum:
                - cpu_usage
                - memory_usage
        condition:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the alert rule is enabled
            window:
              type: string
              description: The window of time to query for the alert rule
            interval:
              type: string
              description: The interval of time to query for the alert rule
            operator:
              type: string
              description: The operator to use for the alert rule
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
              description: The threshold value to use for the alert rule

    AlertingRuleSyncResponse:
      type: object
      properties:
        action:
          type: string
          description: The action taken on the alert rule
          enum:
            - created
            - updated
            - unchanged
            - deleted
        lastSyncedAt:
          type: string
          description: The timestamp of the last sync
        status:
          type: string
          description: The status of the alert rule
          enum:
            - synced
            - failed
        ruleLogicalId:
          type: string
          description: The logical ID (name) of the alert rule
        ruleBackendId:
          type: string
          description: The backend ID (UID from observability backend) of the alert rule

    # Response schema for alert webhook
    AlertWebhookResponse:
      type: object
      properties:
        message:
          type: string
          description: The message of the alert webhook
        status:
          type: string
          description: The status of the alert webhook
          enum:
            - success
            - error

    # New error response schema
    ErrorResponse:
      type: object
      properties:
        title:
          type: string
          description: The error message
          enum:
            - badRequest
            - unauthorized
            - forbidden
            - notFound
            - conflict
            - internalServerError
            - notImplemented
        errorCode:
          type: string
          description: The error code from observer service
          example: OBS-V1-L-22
        message:
          type: string
          description: Human-readable error message
          example: "Missing required fields 'startTime' and 'endTime'"
