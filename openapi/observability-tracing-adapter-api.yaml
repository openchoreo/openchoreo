openapi: 3.0.3
info:
  title: OpenChoreo Observability Tracing Adapter API
  description: |
    This API specification defines the contract that a tracing adapter must implement
    to integrate with the OpenChoreo Observer.
  version: 1.0.0
  contact:
    name: OpenChoreo Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html


tags:
  - name: Traces
    description: Trace retrieval endpoints
  - name: Health
    description: Health check endpoints


paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the tracing adapter service
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  error:
                    type: string
                    example: "tracing backend: connection failed"


  /api/v1alpha1/traces/query:
    post:
      tags:
        - Traces
      summary: Query traces
      description: Query traces from the observer service
      operationId: queryTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TracesQueryRequest"
      responses:
        "200":
          description: Traces queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TracesListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1alpha1/traces/{traceId}/spans/query:
    post:
      tags:
        - Traces
      summary: Query spans for a trace
      description: Query spans for a trace from the observer service
      operationId: querySpansForTrace
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TracesQueryRequest"
      responses:
        "200":
          description: Spans queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceSpansListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1alpha1/traces/{traceId}/spans/{spanId}:
    get:
      tags:
        - Traces
      summary: Get details of a span for a trace
      description: Get details of a span for a trace
      operationId: getSpanDetailsForTrace
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
        - name: spanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Span details queried successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceSpanDetailsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1alpha1/traces/raw-query:
    post:
      tags:
        - Traces
      summary: Run a raw trace query
      description: |
        Runs a read-only request, written for the tracing backend's own API, against
        the trace data and returns the backend's response unchanged. The Observer
        forwards raw queries from callers that hold the cluster-scoped
        `traces:rawquery` permission, with the body and its media type as sent.

        The request body is the backend's native request: `application/json` for
        backends whose requests are JSON (for example an OpenSearch or OpenObserve
        search body), `text/plain` where the query text is the whole request (for
        example KQL). It carries its own time range and row limit.

        An adapter that implements this operation must:
        - call only the backend's read-only search or query API, never a write or
          administration API, whatever the request says;
        - confine the request to the trace data the adapter serves (its trace
          indices, stream type or tables), using credentials that can only read it
          where the backend supports that;
        - override the request fields it owns, such as the query timeout, so a
          request can't widen them;
        - stop the query at its configured query timeout and answer 504;
        - reject a result larger than its configured maximum response size with
          400, never returning a partial result;
        - answer 415 for a media type its backend doesn't take, and 400 for a
          request the backend rejects, with the backend's reason.

        An adapter that does not support raw queries answers 501.
      operationId: queryRawTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawTracesQueryRequest"
          text/plain:
            schema:
              $ref: "#/components/schemas/RawTracesQueryText"
      responses:
        "200":
          description: The backend's response, unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawTracesQueryResponse"
        "400":
          description: |
            Invalid request, a request the backend rejects (the detail gives the
            backend's reason), or a result larger than the maximum response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is larger than the adapter accepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The request body's media type is not one the backend takes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: The adapter does not support raw queries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: The query ran past the adapter's query timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:


  schemas:
    ErrorResponse:
      type: object
      properties:
        title:
          type: string
          description: The error message
          enum:
            - badRequest
            - unauthorized
            - forbidden
            - internalServerError
            - notImplemented
            - gatewayTimeout
            - payloadTooLarge
            - unsupportedMediaType
        errorCode:
          type: string
          description: The error code from observer service
          example: OBS-T-22
        detail:
          type: string
          description: The error message
          example: "Missing required fields 'startTime' and 'endTime'"


    ComponentSearchScope:
      type: object
      properties:
        namespace:
          type: string
        project:
          type: string
        component:
          type: string
        environment:
          type: string
      required: [namespace]


    TracesQueryRequest:
      type: object
      properties:
        startTime:
          type: string
          description: The start time of the query
          format: date-time
        endTime:
          type: string
          description: The end time of the query
          format: date-time
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: The maximum number of items to return
        sortOrder:
          type: string
          description: The sort order of the query
          enum:
            - asc
            - desc
          default: desc
        searchScope:
          $ref: "#/components/schemas/ComponentSearchScope"
        includeAttributes:
          type: boolean
          description: Whether to include span attributes in the response. Defaults to false.
          default: false
      required: [startTime, endTime, searchScope]


    TracesQueryResponse:
      type: object
      oneOf:
        - $ref: "#/components/schemas/TracesListResponse"
        - $ref: "#/components/schemas/TraceSpansListResponse"
        - $ref: "#/components/schemas/TraceSpanDetailsResponse"


    TracesListResponse:
      type: object
      properties:
        traces:
          type: array
          description: The list of traces
          items:
            type: object
            properties:
              traceId:
                type: string
                description: The trace ID
              traceName:
                type: string
                description: The name of the trace
              spanCount:
                type: integer
                description: The number of spans in the trace
              rootSpanId:
                type: string
              rootSpanName:
                type: string
              rootSpanKind:
                type: string
              startTime:
                type: string
                description: The start time of the trace
                format: date-time
              endTime:
                type: string
                description: The end time of the trace
                format: date-time
              durationNs:
                type: integer
                format: int64
                description: The duration of the trace in nanoseconds
              hasErrors:
                type: boolean
                description: Whether any span in the trace has an error status.
        total:
          type: integer
          description: The total number of matching traces, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the traces in milliseconds


    TraceSpansListResponse:
      type: object
      properties:
        spans:
          type: array
          description: The list of spans
          items:
            type: object
            properties:
              spanId:
                type: string
                description: The span ID
              spanName:
                type: string
                description: The name of the span
              spanKind:
                type: string
                description: The kind of the span
              startTime:
                type: string
                description: The start time of the span
                format: date-time
              endTime:
                type: string
                description: The end time of the span
                format: date-time
              durationNs:
                type: integer
                format: int64
                description: The duration of the span in nanoseconds
              parentSpanId:
                type: string
                description: The parent span ID
              status:
                $ref: "#/components/schemas/SpanStatus"
              attributes:
                type: object
                description: The span attributes as a key/value map
                additionalProperties: true
              resourceAttributes:
                type: object
                description: The resource attributes as a key/value map
                additionalProperties: true
        total:
          type: integer
          description: The total number of matching spans, capped at 1000
        tookMs:
          type: integer
          description: The time taken to query the spans in milliseconds


    TraceSpanDetailsResponse:
      type: object
      properties:
        spanId:
          type: string
          description: The span ID
        spanName:
          type: string
          description: The name of the span
        spanKind:
          type: string
          description: The kind of the span
        startTime:
          type: string
          description: The start time of the span
          format: date-time
        endTime:
          type: string
          description: The end time of the span
          format: date-time
        durationNs:
          type: integer
          format: int64
          description: The duration of the span in nanoseconds
        parentSpanId:
          type: string
          description: The parent span ID
        status:
          $ref: "#/components/schemas/SpanStatus"
        attributes:
          type: object
          description: The span attributes as a key/value map
          additionalProperties: true
        resourceAttributes:
          type: object
          description: The resource attributes as a key/value map
          additionalProperties: true

    SpanStatus:
      type: object
      description: >-
        Execution status of the span, following the OpenTelemetry span Status
        model.
      properties:
        code:
          type: string
          enum: [ok, error, unset]
          description: The status code of the span. One of "ok", "error", or "unset".
        message:
          type: string
          description: >-
            Developer-facing human-readable status description. Typically set
            only when code is "error".


    RawTracesQueryRequest:
      x-go-type: json.RawMessage
      description: The backend's native request, as JSON.


    RawTracesQueryText:
      type: string
      description: The backend's native request, as text.


    RawTracesQueryResponse:
      x-go-type: json.RawMessage
      description: The backend's response, unchanged.
