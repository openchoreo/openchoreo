{{- $router := .Values.remoteAgentRouter | default dict }}
{{- if $router.enabled }}
{{- $name := "openchoreo-remote-agent-router" }}
{{- /* Defaults live here because `helm upgrade --reuse-values` drops the chart's own
       defaults, leaving listenPort empty and the Service rejected with "port: 0". */}}
{{- $image := $router.image | default (dict "repository" "ghcr.io/openchoreo/remote-agent-router") }}
{{- $svc := $router.service | default dict }}
{{- $listenPort := $router.listenPort | default 8443 }}
{{- $svcType := $svc.type | default "LoadBalancer" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
rules:
  # The router discovers per-project+env remote-agent Services (to map SNI -> backend).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
    app: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $router.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: router
          image: "{{ include "openchoreo-data-plane.image" (dict "context" . "image" $image) }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          args:
            - --listen=:{{ $listenPort }}
            - --log-level={{ $router.logLevel | default "info" }}
          ports:
            - containerPort: {{ $listenPort }}
          # The router is a bare TCP listener with no HTTP surface, so liveness is
          # "is the port accepting".
          readinessProbe:
            tcpSocket:
              port: {{ $listenPort }}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ $listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml ($router.resources | default dict) | nindent 12 }}
          {{- with $router.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
    app: {{ $name }}
spec:
  type: {{ $svcType }}
  selector:
    app: {{ $name }}
  ports:
    - name: tunnel
      port: {{ $listenPort }}
      targetPort: {{ $listenPort }}
      protocol: TCP
      {{- if and (eq $svcType "NodePort") $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
{{- end }}
