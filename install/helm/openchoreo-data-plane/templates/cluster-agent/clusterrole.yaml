{{- if .Values.clusterAgent.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openchoreo-data-plane.clusterAgent.name" . }}
  labels:
    {{- include "openchoreo-data-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
rules:
# The data-plane agent applies rendered releases into Cell namespaces
# (dp-<ns>-<project>-<environment>-<hash>) that are created at runtime, one per
# Project x Environment. A namespaced Role cannot cover a namespace that does
# not exist yet, so these grants have to be cluster-wide. What stays out is the
# actual privilege-escalation vector: apiGroup rbac.authorization.k8s.io. See
# .github/scripts/verify-cluster-agent-rbac.sh.
- apiGroups: [""]
  resources:
  - namespaces
  verbs: ["*"]
# RBAC, READ ONLY. The RenderedRelease controller reads the live state of every
# GVK it knows about to build `status.resources`, and that list includes
# Role/RoleBinding/ClusterRole/ClusterRoleBinding. The whole read-back aborts on
# the first 403, `status.resources` stays empty, and ReleaseBinding then reports
# `Ready=False / ResourcesProgressing` forever — for a Deployment that is 1/1 and
# serving HTTP 200. Found in T73; the portal's health signal was wrong for every
# component in the platform.
#
# get/list/watch is NOT the escalation vector T12 closed. Escalating needs
# create/update/patch/bind/escalate, which stay denied. Do not widen these verbs.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs: ["get", "list", "watch"]
# Core Kubernetes workload resources
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs: ["*"]
# Deployment scale subresource (required for kubectl scale)
- apiGroups: ["apps"]
  resources:
  - deployments/scale
  - statefulsets/scale
  - replicasets/scale
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  - serviceaccounts
  - endpoints
  verbs: ["*"]
# Cell governance objects emitted by ProjectType templates. Upstream never
# granted these because upstream ProjectTypes do not emit them; ours do.
- apiGroups: [""]
  resources:
  - resourcequotas
  - limitranges
  verbs: ["*"]
- apiGroups: [""]
  resources:
  - pods/log
  - pods/status
  - events
  verbs: ["get", "list"]
# Pod exec (required for occ component exec / interactive shell into pods)
- apiGroups: [""]
  resources:
  - pods/exec
  verbs: ["create", "get"]
# Batch jobs
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["*"]
# Networking
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  - networkpolicies
  verbs: ["*"]
# Autoscaling
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs: ["*"]
# Policy
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs: ["*"]
# Cilium network policies (if using Cilium)
- apiGroups: ["cilium.io"]
  resources:
  - ciliumnetworkpolicies
  - ciliumclusterwidenetworkpolicies
  verbs: ["*"]
# Gateway API resources (if using Gateway API)
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
  - gateways
  - httproutes
  - tcproutes
  - grpcroutes
  - tlsroutes
  - referencegrants
  verbs: ["*"]
# External Secrets Operator
- apiGroups: ["external-secrets.io"]
  resources:
  - externalsecrets
  - secretstores
  - clustersecretstores
  - pushsecrets
  verbs: ["*"]
# External Secrets Operator generators
- apiGroups: ["generators.external-secrets.io"]
  resources:
  - passwords
  verbs: ["*"]
# KGateway resources (if using KGateway)
- apiGroups: ["gateway.kgateway.dev"]
  resources:
  - backends
  - gatewayparameters
  - trafficpolicies
  verbs: ["*"]
{{- end }}
