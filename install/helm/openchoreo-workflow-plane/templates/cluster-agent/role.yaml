{{- if .Values.clusterAgent.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openchoreo-workflow-plane.clusterAgent.name" . }}
  labels:
    {{- include "openchoreo-workflow-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
rules:
# Core Kubernetes workload resources
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs: ["*"]
# Deployment scale subresource (required for kubectl scale)
- apiGroups: ["apps"]
  resources:
  - deployments/scale
  - statefulsets/scale
  - replicasets/scale
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  - serviceaccounts
  - endpoints
  verbs: ["*"]
- apiGroups: [""]
  resources:
  - pods/log
  - pods/status
  - events
  verbs: ["get", "list"]
# Batch jobs
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["*"]
# Networking
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  - networkpolicies
  verbs: ["*"]
# Autoscaling
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs: ["*"]
# Policy
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs: ["*"]
# Cilium network policies (if using Cilium)
- apiGroups: ["cilium.io"]
  resources:
  - ciliumnetworkpolicies
  verbs: ["*"]
# Gateway API resources (if using Gateway API)
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
  - gateways
  - httproutes
  - tcproutes
  - grpcroutes
  verbs: ["*"]
# External Secrets Operator
- apiGroups: ["external-secrets.io"]
  resources:
  - externalsecrets
  - secretstores
  - pushsecrets
  verbs: ["*"]
# Argo Workflows (for CI/CD pipelines)
- apiGroups: ["argoproj.io"]
  resources:
  - workflows
  - workflowtemplates
  - cronworkflows
  verbs: ["*"]
{{- end }}
