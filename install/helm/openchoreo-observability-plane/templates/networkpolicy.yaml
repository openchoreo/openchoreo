{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-plane-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-observability-plane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- with .Values.networkPolicy.unrestrictedIngressAppNames }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-plane-unrestricted-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openchoreo-observability-plane.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- toYaml . | nindent 10 }}
  policyTypes:
    - Ingress
  ingress:
    - {}
{{- end }}
{{- end }}
