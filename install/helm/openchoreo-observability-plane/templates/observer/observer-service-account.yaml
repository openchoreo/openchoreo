apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
  namespace: {{ .Release.Namespace }}
  {{- with .Values.observer.serviceAccount }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "openchoreo-observability-plane.componentLabels" (dict "context" . "component" "observer") | nindent 4 }}
automountServiceAccountToken: true
