apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-observability-plane.componentLabels" (dict "context" . "component" "observer") | nindent 4 }}
  {{- with .Values.observer.serviceAccountAnnotations }}
  # Anotaciones de la ServiceAccount. Existe para `iam.gke.io/gcp-service-account`:
  # Workload Identity necesita las DOS puntas, el binding sobre la GSA y esta
  # anotacion sobre la KSA. Sin ella el pod cae a la identidad por defecto del pool
  # y toda llamada a una API de GCP falla con 403, sin que nada diga que falta esto.
  # Mismo patron que `backstage.serviceAccount.annotations` en el control plane.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
