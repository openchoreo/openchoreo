{{- if and .Values.finOpsAgent.enabled .Values.finOpsAgent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.finOpsAgent.serviceAccount.name | default "finops-agent" }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.finOpsAgent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "openchoreo-observability-plane.componentLabels" (dict "context" . "component" "finops-agent") | nindent 4 }}
{{- end }}
