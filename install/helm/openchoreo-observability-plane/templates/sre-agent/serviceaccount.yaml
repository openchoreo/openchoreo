{{- if and .Values.rca.enabled .Values.rca.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rca.serviceAccount.name | default "rca-agent" }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.rca.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "openchoreo-observability-plane.componentLabels" (dict "context" . "component" .Values.rca.name) | nindent 4 }}
{{- end }}
