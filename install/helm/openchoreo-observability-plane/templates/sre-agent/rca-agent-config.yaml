{{- if .Values.rca.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rca-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-observability-plane.componentLabels" (dict "context" . "component" .Values.rca.name) | nindent 4 }}
data:
  OBSERVER_API_URL: {{ .Values.rca.observerApiUrl | quote }}
  OPENCHOREO_API_URL: {{ .Values.rca.openchoreoApiUrl | quote }}
  AUTHZ_TIMEOUT_SECONDS: {{ .Values.rca.authz.timeoutSeconds | quote }}
  RCA_MODEL_NAME: {{ .Values.rca.llm.modelName | quote }}
  # Empty means "let LangChain infer the provider from the model name";
  # src/clients/llm.py maps the empty string to None before calling
  # init_chat_model, which rejects "" as a provider id.
  RCA_MODEL_PROVIDER: {{ .Values.rca.llm.modelProvider | quote }}
  {{- if .Values.rca.llm.googleCloudProject }}
  GOOGLE_CLOUD_PROJECT: {{ .Values.rca.llm.googleCloudProject | quote }}
  {{- end }}
  {{- if .Values.rca.llm.googleCloudLocation }}
  GOOGLE_CLOUD_LOCATION: {{ .Values.rca.llm.googleCloudLocation | quote }}
  {{- end }}
  {{- if .Values.rca.llm.baseUrl }}
  RCA_LLM_BASE_URL: {{ .Values.rca.llm.baseUrl | quote }}
  {{- end }}
  REPORT_BACKEND: {{ .Values.rca.reportBackend | quote }}
  OAUTH_TOKEN_URL: {{ .Values.security.oidc.tokenUrl | quote }}
  OAUTH_CLIENT_ID: {{ .Values.rca.oauth.clientId | quote }}
  {{- if .Values.rca.oauth.scope }}
  OAUTH_SCOPE: {{ .Values.rca.oauth.scope | quote }}
  {{- end }}
  TLS_INSECURE_SKIP_VERIFY: {{ or .Values.security.oidc.jwksUrlTlsInsecureSkipVerify .Values.security.oidc.uidResolverTlsInsecureSkipVerify | quote }}
  JWT_JWKS_URL: {{ .Values.security.oidc.jwksUrl | quote }}
  JWT_INSECURE_ALLOW_UNVERIFIED: {{ .Values.security.oidc.insecureAllowUnverified | default "false" | quote }}
  JWT_ISSUER: {{ .Values.security.oidc.issuer | quote }}
  JWT_AUDIENCE: {{ .Values.security.jwt.audience | quote }}
  AUTH_CONFIG_PATH: /etc/openchoreo/auth-config.yaml
  LOG_LEVEL: {{ .Values.rca.logLevel | quote }}
  REMED_AGENT: {{ .Values.rca.remedAgent | quote }}
  {{- if .Values.rca.cors.allowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ join "," .Values.rca.cors.allowedOrigins | quote }}
  {{- end }}
{{- end }}
