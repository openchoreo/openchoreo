{{- if not .Values.clusterGateway.tls.existingSecret }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "openchoreo-control-plane.clusterGateway.name" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-gateway
spec:
  secretName: {{ .Values.clusterGateway.tls.secretName }}
  issuerRef:
    {{- if .Values.clusterGateway.tls.issuerRef.kind }}
    kind: {{ .Values.clusterGateway.tls.issuerRef.kind }}
    {{- else }}
    kind: Issuer
    {{- end }}
    name: {{ .Values.clusterGateway.tls.issuerRef.name }}
  dnsNames:
    {{- range .Values.clusterGateway.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
    {{- if .Values.clusterGateway.mesh.enabled }}
    # Mesh peer identity: the serving certificate doubles as the mesh mTLS
    # identity; peers dial each other expecting the headless mesh Service name
    - {{ include "openchoreo-control-plane.clusterGateway.name" . }}-mesh
    - {{ include "openchoreo-control-plane.clusterGateway.name" . }}-mesh.{{ .Release.Namespace }}.svc
    - {{ include "openchoreo-control-plane.clusterGateway.name" . }}-mesh.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
  {{- with .Values.clusterGateway.tls.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.clusterGateway.tls.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
