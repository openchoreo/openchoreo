apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.controllerManager.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-control-plane.componentLabels" (dict "context" . "component" .Values.controllerManager.name) | nindent 4 }}
spec:
  {{- if not .Values.controllerManager.autoscaling.enabled }}
  replicas: {{ .Values.controllerManager.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.controllerManager.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.controllerManager.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "openchoreo-control-plane.componentSelectorLabels" (dict "context" . "component" .Values.controllerManager.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openchoreo-control-plane.componentSelectorLabels" (dict "context" . "component" .Values.controllerManager.name) | nindent 8 }}
        {{- include "openchoreo-control-plane.platformIdentityLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ .Values.controllerManager.name }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controllerManager.priorityClass.create }}
      priorityClassName: {{ .Values.controllerManager.priorityClass.name }}
      {{- end }}
      {{- with .Values.controllerManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.controllerManager.terminationGracePeriodSeconds }}
      {{- /* No init container needed - Secret is created directly by cert-manager */}}
      containers:
      - name: manager
        image: {{ include "openchoreo-control-plane.image" (dict "context" . "image" .Values.controllerManager.image) }}
        imagePullPolicy: {{ .Values.controllerManager.image.pullPolicy }}
        command:
        - /manager
        args: {{- toYaml .Values.controllerManager.manager.args | nindent 8 }}
        - --cluster-gateway-url={{ .Values.controllerManager.clusterGateway.url }}
        - --cluster-gateway-ca-cert={{ .Values.controllerManager.clusterGateway.tls.caPath }}
        {{- if .Values.clusterGateway.internalMtls.enabled }}
        - --cluster-gateway-client-cert={{ .Values.controllerManager.clusterGateway.tls.clientCertPath }}
        - --cluster-gateway-client-key={{ .Values.controllerManager.clusterGateway.tls.clientKeyPath }}
        {{- end }}
        {{- if .Values.controllerManager.clusterGateway.tls.insecure }}
        - --cluster-gateway-insecure
        {{- end }}
        {{- if .Values.controllerManager.manager.maxConcurrentReconciles }}
        - --max-concurrent-reconciles={{ .Values.controllerManager.manager.maxConcurrentReconciles }}
        {{- end }}
        {{- if .Values.controllerManager.manager.logLevel }}
        - --zap-log-level={{ .Values.controllerManager.manager.logLevel }}
        {{- end }}
        {{- if .Values.controllerManager.manager.celCostLimit }}
        {{- /* int64: Helm decodes values.yaml numbers as float64, so a bare render emits
               2e+06, which the controller's uint64 flag parser rejects at startup. */}}
        - --cel-cost-limit={{ int64 .Values.controllerManager.manager.celCostLimit }}
        {{- end }}
        {{- if and .Values.controllerManager.manager.renderTimeout (ne .Values.controllerManager.manager.renderTimeout "0") }}
        - --render-timeout={{ .Values.controllerManager.manager.renderTimeout }}
        {{- end }}
        env:
        - name: ENABLE_WEBHOOKS
          value: {{ quote .Values.controllerManager.manager.env.enableWebhooks }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        - name: CLUSTER_GATEWAY_URL
          value: {{ quote .Values.controllerManager.clusterGateway.url }}
        - name: CLUSTER_GATEWAY_CA_CERT
          value: {{ quote .Values.controllerManager.clusterGateway.tls.caPath }}
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.controllerManager.resources | nindent 10 }}
        {{- if and (eq (toString .Values.controllerManager.manager.env.enableWebhooks) "true") (gt (int .Values.controllerManager.preStopSleepSeconds) 0) }}
        lifecycle:
          preStop:
            exec:
              command: ["/manager", "sleep", "{{ .Values.controllerManager.preStopSleepSeconds }}"]
        {{- end }}
        {{- with .Values.controllerManager.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- if eq (toString .Values.controllerManager.manager.env.enableWebhooks) "true" }}
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- end }}
        - mountPath: /etc/cluster-gateway
          name: cluster-gateway-ca
          readOnly: true
        {{- if .Values.clusterGateway.internalMtls.enabled }}
        - mountPath: /etc/cluster-gateway-client
          name: cluster-gateway-client-tls
          readOnly: true
        {{- end }}
      volumes:
      {{- if eq (toString .Values.controllerManager.manager.env.enableWebhooks) "true" }}
      - name: cert
        secret:
          defaultMode: 420
          secretName: {{ .Values.controllerManager.name }}-webhook-server-cert
      {{- end }}
      # Trust anchor for verifying the gateway. Only ca.crt is mounted; the
      # signing key in that secret stays out of this pod.
      - name: cluster-gateway-ca
        secret:
          secretName: {{ .Values.clusterGateway.tls.existingSecret | default .Values.controllerManager.clusterGateway.tls.caSecret }}
          items:
          - key: ca.crt
            path: ca.crt
      {{- if .Values.clusterGateway.internalMtls.enabled }}
      - name: cluster-gateway-client-tls
        secret:
          secretName: {{ .Values.controllerManager.clusterGateway.tls.clientSecret }}
      {{- end }}
