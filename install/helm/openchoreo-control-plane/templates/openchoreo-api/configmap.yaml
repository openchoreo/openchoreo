{{- if .Values.openchoreoApi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openchoreo-control-plane.openchoreoApi.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
data:
  config.yaml: |
    server:
      bind_address: {{ .Values.openchoreoApi.config.server.bind_address | quote }}
      port: {{ .Values.openchoreoApi.config.server.port }}
      public_url: {{ .Values.openchoreoApi.config.server.publicUrl | quote }}
      timeouts:
        {{- toYaml .Values.openchoreoApi.config.server.timeouts | nindent 8 }}
      tls:
        {{- toYaml .Values.openchoreoApi.config.server.tls | nindent 8 }}
      middleware: {}

    security:
      enabled: {{ .Values.security.enabled }}
      authentication:
        jwt:
          audiences:
            {{- if .Values.security.jwt.audience }}
            - {{ .Values.security.jwt.audience | quote }}
            {{- else }}
            []
            {{- end }}
          clock_skew: {{ .Values.openchoreoApi.config.security.authentication.jwt.clock_skew | quote }}
          jwks:
            refresh_interval: {{ .Values.openchoreoApi.config.security.authentication.jwt.jwks.refresh_interval | quote }}
            skip_tls_verify: {{ .Values.openchoreoApi.config.security.authentication.jwt.jwks.skip_tls_verify }}
      subjects:
        {{- toYaml .Values.openchoreoApi.config.security.subjects | nindent 8 }}
      authorization:
        enabled: {{ .Values.security.authz.enabled }}
        cache:
          {{- toYaml .Values.openchoreoApi.config.security.authorization.cache | nindent 10 }}
        resync_interval: {{ .Values.openchoreoApi.config.security.authorization.resync_interval | quote }}

    identity:
      oidc:
        issuer: {{ .Values.security.oidc.issuer | quote }}
        jwks_url: {{ .Values.security.oidc.jwksUrl | quote }}
        authorization_endpoint: {{ .Values.security.oidc.authorizationUrl | quote }}
        token_endpoint: {{ .Values.security.oidc.tokenUrl | quote }}
      clients:
        {{- range .Values.security.oidc.externalClients }}
        {{ .name }}:
          client_id: {{ .client_id | quote }}
          scopes:
            {{- toYaml .scopes | nindent 12 }}
        {{- end }}
      mcp_oauth_scopes:
        {{- toYaml .Values.security.oidc.mcpOAuthScopes | nindent 8 }}

    mcp:
      enabled: {{ .Values.openchoreoApi.config.mcp.enabled }}
      toolsets:
        {{- toYaml .Values.openchoreoApi.config.mcp.toolsets | nindent 8 }}

{{- /*
Built-in traversal rules come from the chart file
files/resource-tree-builtin-rules.yaml rather than from values, so no --set or
-f can edit them. Operator rules from openchoreoApi.config.resourceTree.rules
are appended after them. The API server replaces its compiled-in rules whenever
config supplies any, so this rendered list is the complete rule set.

The trailing `default list` is load-bearing: concat returns a nil slice when
both inputs are empty, which would render as null rather than [].

All three guards are required. fromYamlArray never fails a render: it returns an
empty list for missing, empty, `null` and `[]` input, and a one-element list
holding the parse error as a string for a map or scalar. A raw-emptiness check
alone therefore lets a `null` or `[]` file through as zero rules.
*/}}
{{- $resourceTree := .Values.openchoreoApi.config.resourceTree }}
{{- $builtInRules := list }}
{{- if not $resourceTree.disableBuiltInRules }}
{{- $rawBuiltInRules := .Files.Get "files/resource-tree-builtin-rules.yaml" }}
{{- if not $rawBuiltInRules }}
{{- fail "files/resource-tree-builtin-rules.yaml is missing or empty; the built-in resource tree rules cannot be rendered" }}
{{- end }}
{{- $builtInRules = fromYamlArray $rawBuiltInRules }}
{{- if not $builtInRules }}
{{- fail "files/resource-tree-builtin-rules.yaml parsed to an empty rule list; rendering it would switch child discovery off for the whole install" }}
{{- end }}
{{- range $rule := $builtInRules }}
{{- if ne (kindOf $rule) "map" }}
{{- fail (printf "files/resource-tree-builtin-rules.yaml is not a list of rules: %v" $rule) }}
{{- end }}
{{- end }}
{{- end }}

    resource_tree:
      # Built-in rules from files/resource-tree-builtin-rules.yaml, then openchoreoApi.config.resourceTree.rules.
      rules:
        {{- toYaml (concat $builtInRules ($resourceTree.rules | default list) | default list) | nindent 8 }}

    secret_management:
      enabled: {{ .Values.features.secretManagement.enabled }}

    cluster_gateway:
      enabled: {{ if hasKey .Values.openchoreoApi.clusterGateway "enabled" }}{{ .Values.openchoreoApi.clusterGateway.enabled }}{{ else }}true{{ end }}
      url: {{ .Values.openchoreoApi.clusterGateway.url | quote }}
      tls:
        {{- if .Values.clusterGateway.tls.enabled }}
        ca_cert_path: {{ .Values.openchoreoApi.clusterGateway.tls.caPath | quote }}
        {{- end }}
        {{- if and .Values.clusterGateway.tls.enabled .Values.clusterGateway.internalMtls.enabled }}
        client_cert_path: {{ .Values.openchoreoApi.clusterGateway.tls.clientCertPath | quote }}
        client_key_path: {{ .Values.openchoreoApi.clusterGateway.tls.clientKeyPath | quote }}
        {{- end }}
        insecure: {{ .Values.openchoreoApi.clusterGateway.tls.insecure }}

    logging:
      {{- toYaml .Values.openchoreoApi.config.logging | nindent 6 }}
{{- end }}
