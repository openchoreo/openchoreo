# Helm values for OpenChoreo Data Plane in k3d multi-cluster setup

clusterAgent:
  serverUrl: "wss://cluster-gateway.openchoreo.localhost:8443/ws"

gateway:
  httpPort: 19080
  httpsPort: 19443
  tls:
    enabled: false

# `occ local` SNI router. NodePort must match the config-dp.yaml host port mapping.
depConnectRouter:
  enabled: true
  service:
    type: NodePort
    nodePort: 30443
