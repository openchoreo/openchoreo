# Helm values for OpenChoreo Data Plane in k3d single-cluster setup

# Gateway configuration for single-cluster setup
gateway:
  httpPort: 19080
  httpsPort: 19443
  tls:
    enabled: false

# `occ remote` SNI router. NodePort must match the config.yaml host port mapping.
remoteAgentRouter:
  enabled: true
  service:
    type: NodePort
    nodePort: 30443
