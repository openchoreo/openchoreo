    # install/quick-start/occ-login.sh calls the ThunderID management API with a
    # client_credentials token for this app, so it is granted the `system`
    # permission. The System resource server identifier is set to
    # <server.publicUrl>/mcp so it matches the token request's `resource` and
    # the Console's derived resource identifier. {{ .PUBLIC_URL }} is resolved
    # by the bootstrap from the server's public URL.
    55-system-app.yaml: |
      resource_type: application
      id: 01900000-0000-7000-8001-000000000064
      ouId: 01900000-0000-7000-8000-000000000001
      name: System Application
      type: m2m
      description: Generic system application for automation and integrations
      inboundAuthConfig:
        - type: oauth2
          config:
            clientId: openchoreo-system-app
            clientSecret: openchoreo-system-app-secret
            grantTypes:
              - client_credentials
            tokenEndpointAuthMethod: client_secret_post
            pkceRequired: false
            publicClient: false
            token:
              accessToken:
                clientConfig:
                  validityPeriod: 3600
      ---
      resource_type: resource_server
      id: 01900000-0000-7000-8000-000000000020
      name: System
      description: System resource server
      identifier: "{{ .PUBLIC_URL }}/mcp"
      ouHandle: default
      resources:
        - name: System
          handle: system
          description: System resource
      ---
      resource_type: role
      id: 01900000-0000-7000-8001-000000000050
      name: OpenChoreo System Automation
      description: Grants the OpenChoreo system application access to the ThunderID management API
      ouHandle: default
      permissions:
        - resourceServerId: 01900000-0000-7000-8000-000000000020
          permissions:
            - system
      assignments:
        - id: 01900000-0000-7000-8001-000000000064
          type: app

