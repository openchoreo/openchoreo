# Shared ThunderID helm values for k3d dev setups.
# Only overrides that differ from ThunderID chart defaults.

fullnameOverride: thunder

httproute:
  enabled: true
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - thunder.openchoreo.localhost

# Not using nginx ingress in openchoreo
ingress:
  enabled: false

# SQLite requires a single writer pod
deployment:
  replicaCount: 1

hpa:
  enabled: false

configuration:
  server:
    httpOnly: true
    publicUrl: "http://thunder.openchoreo.localhost:8080"

  gateClient:
    hostname: "thunder.openchoreo.localhost"
    port: 8080
    scheme: "http"

  database:
    config:
      type: sqlite
    runtime_transient:
      type: sqlite
    entity:
      type: sqlite
    runtime_persistent:
      type: sqlite

  passkey:
    allowedOrigins:
      - "http://openchoreo.localhost:8080"

setup:
  enabled: true

# Declarative resource definitions applied by the setup job's in-process
# bootstrap on top of the chart's shipped defaults (01-default-resources.yaml).
# Documents are upserted by id, so every resource carries a fixed id; ids use
# the 01900000-0000-7000-8001-* block to stay clear of the ThunderID defaults.
bootstrap:
  scripts:
    # Allows the app logoUrls below, which the deny-first img-src baseline blocks.
    # raw.githubusercontent.com is needed because the CDN 301s there.
    #
    # A path override replaces ThunderID's shipped entry instead of merging, so
    # every directive except img-src mirrors the 1.0.1 defaults and must be
    # re-synced against `GET /server-config/csp` on a chart upgrade.
    48-csp.yaml: |
      resource_type: server_config
      name: csp
      value:
        paths:
          - location: "/gate/"
            directives:
              img-src:
                - "'self'"
                - "data:"
                - "https://cdn.statically.io"
                - "https://raw.githubusercontent.com"
              font-src:
                - "'self'"
                - "data:"
              style-src-attr:
                - "'self'"
                - "'unsafe-inline'"
              style-src-elem:
                - "'self'"
          - location: "/console/"
            directives:
              img-src:
                - "'self'"
                - "data:"
                - "https://cdn.statically.io"
                - "https://raw.githubusercontent.com"
              font-src:
                - "'self'"
                - "data:"
              connect-src:
                - "'self'"
                - "https://thunderid.dev"
              style-src-attr:
                - "'self'"
                - "'unsafe-inline'"
              style-src-elem:
                - "'self'"
                - "'unsafe-inline'"
              worker-src:
                - "'self'"
                - "blob:"

    49-cors.yaml: |
      resource_type: server_config
      name: cors
      value:
        allowedOrigins:
          - "http://openchoreo.localhost:8080"
          - "http://localhost:7007"

