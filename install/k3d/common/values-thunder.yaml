    51-backstage-app.yaml: |
      resource_type: application
      id: 01900000-0000-7000-8001-000000000060
      ouId: 01900000-0000-7000-8000-000000000001
      name: Backstage
      type: fullstack
      authFlowId: 01900000-0000-7000-8000-000000000061
      description: OpenChoreo Backstage Portal
      logoUrl: "https://cdn.statically.io/gh/openchoreo/openchoreo.github.io@main/static/img/openchoreo-logo.png"
      allowedUserTypes:
        - openchoreo-user
      assertion:
        validityPeriod: 3600
      inboundAuthConfig:
        - type: oauth2
          config:
            clientId: openchoreo-backstage-client
            clientSecret: backstage-portal-secret
            redirectUris:
              - "http://openchoreo.localhost:8080/api/auth/openchoreo-auth/handler/frame"
            grantTypes:
              - authorization_code
              - client_credentials
              - refresh_token
            responseTypes:
              - code
            tokenEndpointAuthMethod: client_secret_post
            pkceRequired: false
            publicClient: false
            token:
              accessToken:
                userConfig:
                  validityPeriod: 86400
                  attributes:
                    - given_name
                    - family_name
                    - username
                    - groups
                clientConfig:
                  validityPeriod: 86400
              idToken:
                validityPeriod: 86400
                userAttributes:
                  - given_name
                  - family_name
                  - username
                  - groups
            scopeClaims:
              email:
                - email
              groups:
                - groups
              profile:
                - username
                - given_name
                - family_name
                - picture

