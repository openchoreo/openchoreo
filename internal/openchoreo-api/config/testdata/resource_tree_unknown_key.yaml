# Every rule here is valid; only the misspelled "metadata_onlyy" key is wrong,
# and unmarshaling drops it silently.
resource_tree:
  rules:
    - root:
        group: apps
        version: v1
        kind: Deployment
        resource: deployments
      children:
        - kind:
            version: v1
            kind: Pod
            resource: pods
          metadata_onlyy: true
