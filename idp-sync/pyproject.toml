#
# Mismas reglas de lint que `agents/sre-agent/pyproject.toml`, para no introducir un segundo
# estilo de Python en el repo. Unica diferencia: 110 columnas en vez de 100, porque los
# textos de los hallazgos son prosa y partirlos a 100 los vuelve ilegibles en el diff.

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
