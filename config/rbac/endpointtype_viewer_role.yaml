# permissions for end users to view endpointtypes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openchoreo
    app.kubernetes.io/managed-by: kustomize
  name: endpointtype-viewer-role
rules:
- apiGroups:
  - openchoreo.dev
  resources:
  - endpointtypes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openchoreo.dev
  resources:
  - endpointtypes/status
  verbs:
  - get
