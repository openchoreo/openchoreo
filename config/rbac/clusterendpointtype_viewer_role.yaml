# permissions for end users to view clusterendpointtypes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openchoreo
    app.kubernetes.io/managed-by: kustomize
  name: clusterendpointtype-viewer-role
rules:
- apiGroups:
  - openchoreo.dev
  resources:
  - clusterendpointtypes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openchoreo.dev
  resources:
  - clusterendpointtypes/status
  verbs:
  - get
