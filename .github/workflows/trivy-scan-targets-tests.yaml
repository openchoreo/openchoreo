name: Trivy Scan Targets Tests

on:
  pull_request:
    paths:
      - ".github/scripts/trivy_scan_targets.py"
      - ".github/scripts/test_trivy_scan_targets.py"
      - ".github/workflows/trivy-scan-targets-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run scan target tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover .github/scripts -p "test_trivy_scan_targets.py"
