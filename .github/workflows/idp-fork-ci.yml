#
# idp · fork CI — lo unico que corre en los PRs de este espejo.
#
# Los workflows del upstream quedan DESHABILITADOS por API
# (`.github/scripts/sync-actions-allowlist.sh`): publican imagenes y firman releases,
# y no pueden hacerlo con nuestra identidad. Este es el reemplazo: corre nuestras
# verificaciones de fork, que hasta T08b no corrian en ningun lado.
#
# Archivo NUEVO: no toca nada del upstream, asi que no consume presupuesto de diff.
# Va en la fila 0b de PATCHES.md y en la lista OWNED de verify-fork.sh.

name: idp · fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Mismos pines que `idp-upstream-sync.yml`, para no introducir dos versiones de la
  # misma herramienta en el mismo repo. Descarga directa con checksum en vez de una
  # action de terceros: una dependencia menos con permiso de ejecutar codigo.
  HELM_VERSION: "3.16.4"
  HELM_SHA256: fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
  # SHA-256 del asset `yq_linux_amd64`, tomado del archivo `checksums` del propio
  # release (columna SHA-256 segun `checksums_hashes_order`). Para refrescarlo:
  #   curl -fsSL .../vX.Y.Z/checksums_hashes_order   -> indice de "SHA-256"
  #   curl -fsSL .../vX.Y.Z/checksums | grep '^yq_linux_amd64 '
  YQ_VERSION: v4.44.6
  YQ_SHA256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598

concurrency:
  group: idp-fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fork:
    name: verify-fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # El check 4 diffea contra `upstream-main`, asi que hace falta el historial
          # completo y la rama del espejo, que un checkout de PR no trae.
          fetch-depth: 0

      - name: Traer upstream-main
        run: |
          git fetch --no-tags origin '+refs/heads/upstream-main:refs/heads/upstream-main'
          git rev-parse --short upstream-main

      - name: verify-fork
        run: |
          # HEAD y no `main`: en un PR lo que hay que verificar es la rama del PR.
          .github/scripts/verify-fork.sh HEAD upstream-main

      - name: verify-fork --self-test
        # Un verificador que nunca vio un rojo no es un verificador. El self-test
        # inyecta las mutaciones que ya nos mordieron y exige que las detecte.
        run: .github/scripts/verify-fork.sh --self-test

  verify-cluster-agent-rbac:
    name: verify-cluster-agent-rbac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Instalar helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Instalar yq
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install /tmp/yq /usr/local/bin/yq
          yq --version

      - name: verify-cluster-agent-rbac
        run: .github/scripts/verify-cluster-agent-rbac.sh

  verify-authz-bootstrap-prune:
    name: verify-authz-bootstrap-prune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Instalar helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: verify-authz-bootstrap-prune
        run: install/helm/openchoreo-control-plane/tests/verify-authz-bootstrap-prune.sh

  go-test-patched:
    name: go test (paquetes parcheados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        # Solo los paquetes que tocan nuestros parches. El build-and-test del upstream
        # queda deshabilitado a proposito; esto no lo reemplaza, cubre lo nuestro.
        run: go test ./internal/cluster-gateway/... ./internal/cluster-agent/...
